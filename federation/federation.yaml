                    description: Media type of the resource.
                    enum:
                        - application/vnd.netapp.bxp.connection
                    example: application/vnd.netapp.bxp.connection
                    type: string
                version:
                    description: Version of the resource.
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            type: object
        domain_1.0_get_response_body:
            properties:
                code:
                    description: The unique verification code for this domain.
                    example: Console133ad2ea-99de-4ada-9be4-876d4d53923e
                    type: string
                federations:
                    description: The list of federations that use this domain.
                    example:
                        - id: 4336388b-2992-43af-81de-ba9284b7dc36
                          name: Example Co. AD FS
                        - id: 645eae30-ea32-4542-af58-1d9012fed81a
                          name: Example Co. SAML
                    items:
                        properties:
                            id:
                                description: Globally unique identifier of the resource conforming to the UUIDv4 schema.
                                example: 4336388b-2992-43af-81de-ba9284b7dc36
                                format: uuid
                                type: string
                            name:
                                description: The name of the federation.
                                example: Example Co.
                                type: string
                        type: object
                    type: array
                    uniqueItems: true
                id:
                    description: Globally unique identifier of the resource conforming to the UUIDv4 schema.
                    example: 4336388b-2992-43af-81de-ba9284b7dc36
                    format: uuid
                    type: string
                metadata:
                    $ref: '#/components/schemas/type_bxp_metadata'
                name:
                    description: The domain name.
                    example: example.com
                    type: string
                organizationId:
                    description: Identifier for an organization.
                    example: 9b0ee210-70a0-4158-b025-0decde66e4de
                    format: uuid
                    type: string
                resourceId:
                    description: Identifier for the resource.
                    example: 862b6f03-58ac-479b-9ca5-5cb4429d8996
                    format: uuid
                    type: string
                state:
                    description: |-
                        The state of the domain.
                        Defined values are:
                        * "UNVERIFIED" - Ownership of the domain has not been verified.
                        * "VERIFIED" - Ownership of the domain has been verified using a DNS TXT record with the verification code.
                    enum:
                        - UNVERIFIED
                        - VERIFIED
                    example: VERIFIED
                    type: string
                type:
                    description: Media type of the resource.
                    enum:
                        - application/vnd.netapp.bxp.domain
                    example: application/vnd.netapp.bxp.domain
                    type: string
                verificationTimestamp:
                    description: The date that the domain was verified.
                    example: "2024-11-18T20:58:16.305662Z"
                    format: date-time
                    type: string
                version:
                    description: Version of the resource.
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            type: object
        domain_1.0_list_response_body:
            properties:
                count:
                    description: Total number of resources in the collection that match the query.
                    example: 1
                    format: int64
                    minimum: 0
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/domain_1.0_get_response_body'
                    type: array
                    uniqueItems: true
            required:
                - items
            type: object
        domain_1.0_patch_request_body:
            additionalProperties: false
            properties:
                stateDesired:
                    description: The desired state of the domain.
                    enum:
                        - VERIFIED
                    example: VERIFIED
                    type: string
                type:
                    description: Media type of the resource.
                    enum:
                        - application/vnd.netapp.bxp.domain
                    example: application/vnd.netapp.bxp.domain
                    type: string
                version:
                    description: Version of the resource.
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            required:
                - type
                - version
                - stateDesired
            type: object
        domain_1.0_post_request_body:
            additionalProperties: false
            properties:
                name:
                    description: The domain name.
                    example: example.com
                    type: string
                type:
                    description: Media type of the resource.
                    enum:
                        - application/vnd.netapp.bxp.domain
                    example: application/vnd.netapp.bxp.domain
                    type: string
                version:
                    description: Version of the resource.
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            required:
                - type
                - version
                - name
            type: object
        federation_1.0_get_response_body:
            properties:
                auth0Id:
                    description: The ID of the connection in Auth0.
                    example: con_jxQFVfPHKSdiwoxs
                    type: string
                auth0Name:
                    description: The name of the connection in Auth0.
                    example: fed-example-com-waad
                    type: string
                autoAssignDefaultRoleIds:
                    description: Identifier of roles assigned to first-time users automatically added to the organization
                    example:
                        - 4336388b-2992-43af-81de-ba9284b7dc36
                    items:
                        format: uuid
                        type: string
                    maxItems: 5
                    type: array
                    uniqueItems: true
                autoAssignUsersEnabled:
                    default: false
                    description: Whether first-time users should be automatically added to the organization when using this federation for SSO.
                    example: false
                    type: boolean
                domains:
                    description: Array of email domain names that are associated with the federation.
                    example:
                        - example.com
                        - example2.com
                    items:
                        type: string
                    minItems: 1
                    type: array
                    uniqueItems: true
                expirationNotificationPeriod:
                    description: |-
                        The time period when expiration notifications are generated. Defined values are:
                        * "P7D" - Notifications are sent daily 7 days before expiration.
                        * "P30D" - Notifications are sent weekly 30 days before expiration. Notifications are sent daily 7 days before expiration.
                    enum:
                        - P7D
                        - P30D
                    example: P30D
                    type: string
                expirationTimestamp:
                    description: |-
                        The date that the credentials or certificate expires. When a certificate is provided, the value is set to
                        the certificate's expiration timestamp.
                    example: "2024-11-18T20:58:16.305662Z"
                    format: date-time
                    type: string
                id:
                    description: Globally unique identifier of the resource conforming to the UUIDv4 schema.
                    example: 4336388b-2992-43af-81de-ba9284b7dc36
                    format: uuid
                    type: string
                keycloakComponentId:
                    description: Keycloak component identifier for LDAP provider.
                    example: b3f7c2e2-1b3b-4e2a-9c8e-123456789abc
                    type: string
                keycloakComponentName:
                    description: Keycloak component name for LDAP provider.
                    example: Active Directory
                    type: string
                ldapOptions:
                    $ref: '#/components/schemas/federation_1.0_ldap_response_options'
                metadata:
                    $ref: '#/components/schemas/type_bxp_metadata'
                name:
                    description: The name of the federation.
                    example: Example Co.
                    type: string
                organizationId:
                    description: Identifier for an organization.
                    example: 9b0ee210-70a0-4158-b025-0decde66e4de
                    format: uuid
                    type: string
                providerType:
                    description: |-
                        The type of the identity provider. Defined values are:
                        * "LDAP" - Lightweight Directory Access Protocol
                    enum:
                        - LDAP
                    example: LDAP
                    type: string
                resourceId:
                    description: Identifier for the resource.
                    example: 862b6f03-58ac-479b-9ca5-5cb4429d8996
                    format: uuid
                    type: string
                state:
                    description: |-
                        The state of the federation. Defined values are:
                        * "DRAFT" - The federation is partially configured.
                        * "CREATED" - The federation is configured but not tested.
                        * "TESTED" - The federation has been successfully tested.
                        * "ENABLED" - The federation is enabled.
                        * "DISABLED" - The federation is disabled.
                    enum:
                        - DRAFT
                        - CREATED
                        - TESTED
                        - ENABLED
                        - DISABLED
                    example: ENABLED
                    type: string
                type:
                    description: Media type of the resource.
                    enum:
                        - application/vnd.netapp.bxp.federation
                    example: application/vnd.netapp.bxp.federation
                    type: string
                version:
                    description: Version of the resource.
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            type: object
        federation_1.0_ldap_patch_request_options:
            description: Lightweight Directory Access Protocol (LDAP) configuration options when `providerType=LDAP`.
            properties:
                bindCredential:
                    description: Password for the bind DN.
                    example: P@ssw0rd!
                    type: string
                bindDn:
                    description: Distinguished Name (DN) or UPN to bind to the LDAP server.
                    example: cn=admin,dc=example,dc=com
                    type: string
                connectionTimeout:
                    default: 10
                    description: LDAP connection timeout, in seconds.
                    example: 10
                    format: int32
                    minimum: 1
                    type: integer
                connectionUrl:
                    description: LDAP connection URL.
                    example: ldap://example.com:389
                    type: string
                importUsers:
                    default: false
                    description: Indicates whether to import users from LDAP.
                    example: true
                    type: boolean
                pagination:
                    default: true
                    description: Indicates whether to use LDAP pagination for user searches.
                    example: true
                    type: boolean
                rdnLdapAttribute:
                    description: LDAP attribute used as Relative Distinguished Name (RDN).
                    example: cn
                    type: string
                searchScope:
                    default: SUBTREE
                    description: LDAP search scope.
                    enum:
                        - ONELEVEL
                        - SUBTREE
                    example: SUBTREE
                    type: string
                syncRegistrations:
                    default: false
                    description: Indicates whether to synchronize user registrations from LDAP.
                    example: true
                    type: boolean
                userObjectClasses:
                    description: LDAP object class for users.
                    example: person
                    type: string
                usernameLdapAttribute:
                    description: LDAP attribute used as username.
                    example: sAMAccountName
                    type: string
                usersDn:
                    description: Base DN for user searches.
                    example: cn=Users,dc=example,dc=com
                    type: string
                uuidLdapAttribute:
                    description: LDAP attribute used as universally unique identifier (UUID).
                    example: objectGUID
                    type: string
            type: object
        federation_1.0_ldap_post_request_options:
            description: Lightweight Directory Access Protocol (LDAP) configuration options when `providerType=LDAP`.
            properties:
                bindCredential:
                    description: Password for the bind DN.
                    example: P@ssw0rd!
                    type: string
                bindDn:
                    description: Distinguished Name (DN) or UPN to bind to the LDAP server.
                    example: cn=admin,dc=example,dc=com
                    type: string
                connectionTimeout:
                    default: 10
                    description: LDAP connection timeout, in seconds.
                    example: 10
                    format: int32
                    minimum: 1
                    type: integer
                connectionUrl:
                    description: LDAP connection URL.
                    example: ldap://example.com:389
                    type: string
                importUsers:
                    default: false
                    description: Indicates whether to import users from LDAP.
                    example: true
                    type: boolean
                pagination:
                    default: true
                    description: Indicates whether to use LDAP pagination for user searches.
                    example: true
                    type: boolean
                rdnLdapAttribute:
                    description: LDAP attribute used as Relative Distinguished Name (RDN).
                    example: cn
                    type: string
                searchScope:
                    default: SUBTREE
                    description: LDAP search scope.
                    enum:
                        - ONELEVEL
                        - SUBTREE
                    example: SUBTREE
                    type: string
                syncRegistrations:
                    default: false
                    description: Indicates whether to synchronize user registrations from LDAP.
                    example: true
                    type: boolean
                userObjectClasses:
                    description: LDAP object class for users.
                    example: person
                    type: string
                usernameLdapAttribute:
                    description: LDAP attribute used as username.
                    example: sAMAccountName
                    type: string
                usersDn:
                    description: Base DN for user searches.
                    example: cn=Users,dc=example,dc=com
                    type: string
                uuidLdapAttribute:
                    description: LDAP attribute used as universally unique identifier (UUID).
                    example: objectGUID
                    type: string
            required:
                - connectionUrl
                - bindDn
                - bindCredential
                - usersDn
                - connectionTimeout
            type: object
        federation_1.0_ldap_response_options:
            description: Lightweight Directory Access Protocol (LDAP) configuration options when `providerType=LDAP`.
            properties:
                bindCredential:
                    description: Password for the bind DN.
                    example: P@ssw0rd!
                    type: string
                bindDn:
                    description: Distinguished Name (DN) or UPN to bind to the LDAP server.
                    example: cn=admin,dc=example,dc=com
                    type: string
                connectionTimeout:
                    default: 10
                    description: LDAP connection timeout, in seconds.
                    example: 10
                    format: int32
                    minimum: 1
                    type: integer
                connectionUrl:
                    description: LDAP connection URL.
                    example: ldap://example.com:389
                    type: string
                importUsers:
                    default: false
                    description: Indicates whether to import users from LDAP.
                    example: true
                    type: boolean
                pagination:
                    default: true
                    description: Indicates whether to use LDAP pagination for user searches.
                    example: true
                    type: boolean
                rdnLdapAttribute:
                    description: LDAP attribute used as Relative Distinguished Name (RDN).
                    example: cn
                    type: string
                searchScope:
                    default: SUBTREE
                    description: LDAP search scope.
                    enum:
                        - ONELEVEL
                        - SUBTREE
                    example: SUBTREE
                    type: string
                syncRegistrations:
                    default: false
                    description: Indicates whether to synchronize user registrations from LDAP.
                    example: true
                    type: boolean
                userObjectClasses:
                    description: LDAP object class for users.
                    example: person
                    type: string
                usernameLdapAttribute:
                    description: LDAP attribute used as username.
                    example: sAMAccountName
                    type: string
                usersDn:
                    description: Base DN for user searches.
                    example: cn=Users,dc=example,dc=com
                    type: string
                uuidLdapAttribute:
                    description: LDAP attribute used as universally unique identifier (UUID).
                    example: objectGUID
                    type: string
            type: object
        federation_1.0_list_response_body:
            properties:
                count:
                    description: Total number of resources in the collection that match the query.
                    example: 1
                    format: int64
                    minimum: 0
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/federation_1.0_get_response_body'
                    type: array
                    uniqueItems: true
            required:
                - items
            type: object
        federation_1.0_patch_request_body:
            additionalProperties: false
            properties:
                autoAssignDefaultRoleIds:
                    description: Role IDs assigned on JIT first-login provision. View-only roles only - Max 5.
                    example:
                        - 4336388b-2992-43af-81de-ba9284b7dc36
                    items:
                        format: uuid
                        type: string
                    maxItems: 5
                    type: array
                    uniqueItems: true
                autoAssignUsersEnabled:
                    default: false
                    description: 'When true, Console auto-creates (JIT) a user identity and org membership        '
                    example: false
                    type: boolean
                domains:
                    description: |-
                        Array of email domain names that are associated with the federation.
                        <br/>All previously configured domains must be included in the request body when updating the `domains`
                        field or they are removed. Previously configured domains do not need to be in a `VERIFIED` state.
                        <br/>
                        If a domain matches the user's email address or is an Entra ID `*.onmicrosoft.com` tenant domain, then it
                        does not need to be in a `VERIFIED` state. All other domains must be added to the domains
                        collection and be in a `VERIFIED` state.
                    example:
                        - example.com
                        - example2.com
                    items:
                        type: string
                    minItems: 1
                    type: array
                    uniqueItems: true
                expirationNotificationPeriod:
                    description: |-
                        The time period when expiration notifications are generated. Defined values are:
                        * "P7D" - Notifications are sent daily 7 days before expiration.
                        * "P30D" - Notifications are sent weekly 30 days before expiration. Notifications are sent daily 7 days before expiration.
                    enum:
                        - P7D
                        - P30D
                    example: P30D
                    type: string
                expirationTimestamp:
                    description: Not applicable for LDAP federations.
                    example: "2024-11-18T20:58:16.305662Z"
                    format: date-time
                    type: string
                ldapOptions:
                    $ref: '#/components/schemas/federation_1.0_ldap_patch_request_options'
                name:
                    description: The name of the federation.
                    example: Example Co.
                    type: string
                providerType:
                    description: |-
                        The type of the identity provider. Defined values are:
                        * "LDAP" - Lightweight Directory Access Protocol
                    enum:
                        - LDAP
                    example: LDAP
                    type: string
                stateDesired:
                    description: |-
