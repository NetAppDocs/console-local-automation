openapi: 3.0.3
components:
    parameters:
        continue:
            description: |-
                Indicates the token to resume from when listing a collection.


                URL examples: "continue=[Continue Token from Collection Metadata]"


                OpenAPI examples: "[Continue Token from Collection Metadata]"
            in: query
            name: continue
            schema:
                $ref: '#/components/schemas/query_continue'
        count:
            description: |-
                Indicates if the total number of resources should be returned in the response object.


                URL examples: "count=true"


                OpenAPI examples: "true"
            in: query
            name: count
            schema:
                $ref: '#/components/schemas/query_count'
        filter:
            description: |-
                Specifies which fields should be matched in order to return a resource when listing a collection.


                Supported operators:
                * eq - Equality
                * lt/gt - Less than/greater than
                * lte/gte - Less than or equal to/greater than or equal to


                URL example: "filter=field%20eq%20%27value%27"


                OpenAPI examples: "field eq 'value'"
            in: query
            name: filter
            schema:
                $ref: '#/components/schemas/query_filter'
        include:
            description: |-
                Specifies which fields should be returned when listing a collection.


                URL examples: "include=id", "include=id,name"


                OpenAPI examples: "id"
            in: query
            name: include
            schema:
                $ref: '#/components/schemas/query_include'
        limit:
            description: |-
                Specifies the maximum number of resources to return when listing a collection.


                URL examples: "limit=2"


                OpenAPI examples: "2"
            in: query
            name: limit
            schema:
                $ref: '#/components/schemas/query_limit'
        metadata:
            description: |-
                Indicates if the metadata should be returned in the response object.


                URL examples: "metadata=true"

                OpenAPI examples: "true"
            in: query
            name: metadata
            schema:
                $ref: '#/components/schemas/query_metadata'
        order_by:
            description: |-
                Indicates the sort order of resources when listing a collection.


                URL examples: "orderBy=name", "orderBy=name%20desc"


                OpenAPI examples: "name desc"
            in: query
            name: orderBy
            schema:
                $ref: '#/components/schemas/query_order_by'
        organization_id:
            description: Identifier for an organization.
            in: path
            name: organization_id
            required: true
            schema:
                format: uuid
                type: string
        skip:
            description: |-
                Specifies the number of resources to skip when listing a collection.


                URL examples: "skip=1"


                OpenAPI examples: "1"
            in: query
            name: skip
            schema:
                $ref: '#/components/schemas/query_skip'
    responses:
        400BadRequest:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The supplied query parameters are invalid.
                        status: "400"
                        title: Invalid query parameters
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Bad Request
        401Unauthorized:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request is missing the required bearer token.
                        status: "401"
                        title: Missing bearer token
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Unauthorized
        403Forbidden:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The requested operation isn't permitted.
                        status: "403"
                        title: Operation not permitted
                        type: https://bluexp.netapp.io/problems/11
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Forbidden
        404NotFound:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The collection specified in the request URI wasn't found.
                        status: "404"
                        title: Collection not found
                        type: https://bluexp.netapp.io/problems/2
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Not Found
        409Conflict:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request body JSON contains a field that conflicts with an idempotent value.
                        status: "409"
                        title: JSON resource conflict
                        type: https://bluexp.netapp.io/problems/10
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Conflict
        413RequestEntityTooLarge:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request entity is too large.
                        status: "413"
                        title: Request entity too large
                        type: https://bluexp.netapp.io/problems/17
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Request Entity Too Large
        422UnprocessableEntity:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request body is well-formed but contains semantically invalid field combinations.
                        status: "422"
                        title: Unprocessable entity
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Unprocessable Entity
        429TooManyRequests:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: Too many requests have been made. Please retry later.
                        status: "429"
                        title: Too many requests
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Too Many Requests
        503ServiceNotReady:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The service is not ready to handle requests.
                        status: "503"
                        title: Service not ready
                        type: https://bluexp.netapp.io/problems/15
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Service Not Ready
    schemas:
        connection_1.0_get_response_body:
            properties:
                domains:
                    description: Array of email domain names that are associated with the connection.
                    example:
                        - example.com
                        - example2.com
                    items:
                        type: string
                    minItems: 1
                    type: array
                    uniqueItems: true
                id:
                    description: The ID of the Auth0 connection.
                    example: con_jxQFVfPHKSdiwoxs
                    type: string
                name:
                    description: The name of the Auth0 connection.
                    example: fed-example-com-waad
                    type: string
                type:
                    description: Media type of the resource.
                    enum:
                        - application/vnd.netapp.bxp.connection
                    example: application/vnd.netapp.bxp.connection
                    type: string
                version:
                    description: Version of the resource.
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            type: object
        connection_1.0_list_response_body:
            properties:
                count:
                    description: Total number of resources in the collection that match the query.
                    example: 1
                    format: int64
                    minimum: 0
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/connection_1.0_get_response_body'
                    type: array
                    uniqueItems: true
            required:
                - items
            type: object
        connection_1.0_patch_request_body:
            additionalProperties: false
            properties:
                stateDesired:
                    description: |-
                        The desired state of the connection. Defined values are:
                        * "SYNCED" - The connection is synced with Auth0.
                    enum:
                        - SYNCED
                    example: SYNCED
                    type: string
                type:
                    description: Media type of the resource.
                    enum:
                        - application/vnd.netapp.bxp.connection
                    example: application/vnd.netapp.bxp.connection
                    type: string
                version:
                    description: Version of the resource.
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            required:
                - type
                - version
                - stateDesired
            type: object
        connection_1.0_patch_response_body:
            properties:
                domains:
                    description: Array of email domain names that are associated with the connection.
                    example:
                        - example.com
                        - example2.com
                    items:
                        type: string
                    minItems: 1
                    type: array
                    uniqueItems: true
                id:
                    description: The ID of the Auth0 connection.
                    example: con_jxQFVfPHKSdiwoxs
                    type: string
                name:
                    description: The name of the Auth0 connection.
                    example: fed-example-com-waad
                    type: string
                state:
                    description: |-
                        The state of the connection. Defined values are:
                        * "SYNCED" - The connection is synced with Auth0.
                    enum:
                        - SYNCED
                    example: SYNCED
