                    description: Number of NTP servers configured for the cluster.
                    example: 3
                    type: number
                ontapVersion:
                    description: Cluster version information. When the cluster has more than one node, the cluster version is equivalent to the lowest of generation, major, and minor versions on all nodes.
                    properties:
                        full:
                            description: The full version string.
                            example: 'NetApp Release 9.13.0: Sun Aug 06 18:20:57 UTC 2023'
                            type: string
                        generation:
                            description: The generation portion of the version.
                            example: 9
                            type: number
                        major:
                            description: The major portion of the version.
                            example: 16
                            type: number
                        minor:
                            description: The minor portion of the version.
                            example: 0
                            type: number
                    type: object
                organizationId:
                    description: Identifier for an organization.
                    example: 9b0ee210-70a0-4158-b025-0decde66e4de
                    format: uuid
                    type: string
                personality:
                    description: |-
                        The personality of the ONTAP cluster, derived from the cluster's disaggregated and SAN-optimized configuration.
                        Defined values are:
                        * "UNIFIED_ONTAP" - A traditional unified ONTAP cluster (not disaggregated).
                        * "ASA_R2" - A disaggregated, SAN-optimized All-Flash SAN Array (ASA) r2 cluster.
                        * "AFX" - A disaggregated cluster that is not SAN-optimized.
                    enum:
                        - UNIFIED_ONTAP
                        - ASA_R2
                        - AFX
                    example: UNIFIED_ONTAP
                    type: string
                security:
                    description: Security related information for the cluster.
                    properties:
                        asupHttpsConfigured:
                            description: Indicates whether or not HTTPS is configured for AutoSupport.
                            example: true
                            type: boolean
                        certificateExpiryStatus:
                            description: |-
                                The expiration status of the admin SVM SSL certificate.
                                Defined values are:
                                * "ACTIVE" - The certificate has not expired.
                                * "EXPIRED" - The certificate has expired.
                                * "EXPIRING" - The certificate expires within 60 days.
                                * "UNKNOWN" - The certificate expiration status cannot be determined.
                            enum:
                                - ACTIVE
                                - EXPIRED
                                - EXPIRING
                                - UNKNOWN
                            example: ACTIVE
                            type: string
                        certificateExpiryTime:
                            description: The expiration time of the admin SVM SSL certificate in ISO 8601 format.
                            example: "2024-12-31T23:59:59Z"
                            format: date-time
                            type: string
                        clusterPeerEncryptionStatus:
                            description: |-
                                Indicates whether or not all cluster peer connections are encrypted.
                                Defined values are:
                                * "ENCRYPTED" - All cluster peer connections are encrypted.
                                * "NOT_ENCRYPTED" - Some cluster peer connections are not encrypted.
                                * "NOT_PEERED" - The cluster is not peered with any other clusters
                            enum:
                                - ENCRYPTED
                                - NOT_ENCRYPTED
                                - NOT_PEERED
                            example: ENCRYPTED
                            type: string
                        compliancePercent:
                            description: |-
                                Percentage of security best practices that the cluster has configured, in the range [0, 100].
                                A cluster is considered non-compliant if any of the following conditions are true:
                                * FIPS mode is not enabled.
                                * Telnet is enabled.
                                * SSH is configured with insecure ciphers.
                                * No login banner is configured at the cluster scope.
                                * Cluster peer connections are not encrypted.
                                * Less than three NTP servers are configured.
                                * Remote audit log forwarding is not encrypted.
                                * AutoSupport HTTPS transport is not configured.
                                * The default admin user account is enabled.
                                * Remote Shell (rsh) is enabled.
                                * MD5 password hashing is used for any account.
                            example: 90.9
                            format: double
                            maximum: 100
                            minimum: 0
                            type: number
                        defaultAdminUserEnabled:
                            description: Indicates whether the default admin user account is enabled.
                            example: false
                            type: boolean
                        fipsEnabled:
                            description: Indicates whether or not the software FIPS mode is enabled on the cluster.
                            example: false
                            type: boolean
                        isMD5PasswordHashUsed:
                            description: Indicates whether or not MD5 password hashing is used for any account on the cluster.
                            example: false
                            type: boolean
                        keyManagerConfigured:
                            description: Indicates whether or not a key manager is configured for the cluster.
                            example: true
                            type: boolean
                        logForwardEncrypted:
                            description: |-
                                Indicates whether or not audit log forwarding is encrypted.
                                Defined values are:
                                * "ENCRYPTED" - Audit log forwarding is encrypted for all destinations.
                                * "NOT_ENCRYPTED" - Audit log forwarding is not encrypted for some destinations.
                                * "NOT_CONFIGURED" - Audit log forwarding is not configured.
                            enum:
                                - ENCRYPTED
                                - NOT_ENCRYPTED
                                - NOT_CONFIGURED
                            example: ENCRYPTED
                            type: string
                        loginBannerConfigured:
                            description: Indicates whether the login banner is configured.
                            example: true
                            type: boolean
                        rshEnabled:
                            description: Indicates whether or not security protocol rsh is enabled on the cluster.
                            example: false
                            type: boolean
                        sshSecured:
                            description: Indicates whether or not the admin SVM uses secure SSH ciphers.
                            example: false
                            type: boolean
                        telnetEnabled:
                            description: Indicates whether or not security protocol telnet is enabled on the cluster.
                            example: false
                            type: boolean
                    type: object
                space:
                    $ref: '#/components/schemas/cluster_1.0_space'
                status:
                    description: |-
                        The reachability status of the cluster.
                        Defined values are:
                        * "REACHABLE" - The cluster is reachable and operational.
                        * "UNREACHABLE" - The cluster is not reachable.
                        * "UNKNOWN" - The reachability status cannot be determined (e.g., monitoring data is stale or unavailable).
                    enum:
                        - REACHABLE
                        - UNREACHABLE
                        - UNKNOWN
                    example: REACHABLE
                    type: string
                type:
                    description: |-
                        Media type of the resource.
                        Defined values are:
                          * "application/vnd.netapp.bxp.cluster"
                    enum:
                        - application/vnd.netapp.bxp.cluster
                    example: application/vnd.netapp.bxp.cluster
