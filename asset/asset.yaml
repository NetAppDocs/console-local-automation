        qospolicygroup_1.0_adaptive:
            description: |-
                Adaptive QoS policy settings. Defines a variable SLO that adjusts based on
                the space usage of the associated storage object. Policies are always enforced
                individually per storage object.
            properties:
                absoluteMinIops:
                    description: |-
                        Absolute minimum IOPS, used as an override when expected IOPS is less than this value.
                        Not guaranteed on non-AFF platforms or when FabricPool tiering policies are set.
                    example: 1000
                    type: integer
                blockSize:
                    description: |-
                        Specifies the block size.
                        Defined values are:
                        * "ANY" - Any block size.
                        * "4K"
                        * "8K"
                        * "16K"
                        * "32K"
                        * "64K"
                        * "128K"
                    enum:
                        - ANY
                        - 4K
                        - 8K
                        - 16K
                        - 32K
                        - 64K
                        - 128K
                    example: ANY
                    type: string
                expectedIops:
                    description: |-
                        Expected IOPS per TB allocated, based on the storage object allocated size.
                        Not guaranteed on non-AFF platforms or when FabricPool tiering policies are set.
                    example: 6144
                    type: integer
                expectedIopsAllocation:
                    description: |-
                        Specifies the space used to calculate expected IOPS per TB.
                        Defined values are:
                        * "ALLOCATED_SPACE" - IOPS based on allocated space.
                        * "USED_SPACE" - IOPS based on used space.
                    enum:
                        - ALLOCATED_SPACE
                        - USED_SPACE
                    example: ALLOCATED_SPACE
                    type: string
                peakIops:
                    description: Maximum possible IOPS per TB allocated, based on the storage object allocated size or used size.
                    example: 12288
                    type: integer
                peakIopsAllocation:
                    description: |-
                        Specifies the space used to calculate peak IOPS per TB.
                        Defined values are:
                        * "ALLOCATED_SPACE" - IOPS based on allocated space.
                        * "USED_SPACE" - IOPS based on used space.
                    enum:
                        - ALLOCATED_SPACE
                        - USED_SPACE
                    example: USED_SPACE
                    type: string
            type: object
        qospolicygroup_1.0_fixed:
            description: Fixed QoS policy settings. Defines a static SLO for associated storage objects.
            properties:
                capacityShared:
                    description: Specifies whether the capacities are shared across all objects that use this QoS policy-group.
                    example: false
                    type: boolean
                maxThroughputIops:
                    description: Maximum throughput in IOPS. 0 means no maximum IOPS is enforced.
                    example: 15000
                    type: integer
                maxThroughputMbps:
                    description: Maximum throughput in MB/s. 0 means no maximum throughput is enforced.
                    example: 468
                    type: integer
                minThroughputIops:
                    description: |-
                        Minimum throughput in IOPS. 0 means no minimum IOPS is enforced.
                        Not guaranteed on non-AFF platforms or when FabricPool tiering policies are set.
                    example: 5000
                    type: integer
                minThroughputMbps:
                    description: |-
                        Minimum throughput in MB/s. 0 means no minimum throughput is enforced.
                        Not guaranteed on non-AFF platforms or when FabricPool tiering policies are set.
                    example: 100
                    type: integer
            type: object
