                                        value:
                                            description: Numeric value at the specified timestamp.
                                            example: 42.5
                                            format: double
                                            type: number
                                    required:
                                        - timestamp
                                        - value
                                    type: object
                                type: array
                        required:
                            - labels
                            - points
                        type: object
                    type: array
            type: object
        cluster_1.0_get_response_body:
