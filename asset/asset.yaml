                    description: |-
                        Version of the resource.
                        Defined values are:
                        * "1.0"
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
                volumeCount:
                    description: Number of FlexVol and FlexGroup volumes in the cluster.
                    example: 100
                    type: number
                workingEnvironmentId:
                    description: Identifier for the asset's system.
                    example: OnPremWorkingEnvironment-KxESQhek
                    type: string
            type: object
