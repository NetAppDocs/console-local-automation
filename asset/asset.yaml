                    type: integer
                availablePercent:
                    description: The space available, as a percent.
                    format: double
                    type: number
                inodes:
                    description: File inode usage information for the volume.
                    properties:
                        filesTotal:
                            description: The maximum number of files (inodes) for user-visible data allowed on the volume.
                            format: int64
                            type: integer
                        usedPercent:
                            description: Number of files (inodes) used, as a percent.
                            format: double
                            type: number
                    type: object
                logicalUsed:
                    description: The logical used space, in bytes.
                    format: int64
                    type: integer
                quotaCommitted:
                    description: The total space committed by all user-defined qtree quotas on the volume, in bytes.
                    format: int64
                    type: integer
                snapshot:
                    description: Snapshot space usage information for the volume.
                    properties:
                        autodelete:
                            description: Snapshot autodelete settings for the volume.
                            properties:
                                enabled:
                                    description: Specifies whether snapshot autodelete is currently enabled on this volume.
                                    type: boolean
                            type: object
                        count:
                            description: Number of snapshots in the volume.
                            format: int64
                            type: integer
                        overflowPercent:
                            description: Percentage of active file system space consumed by snapshots exceeding the snapshot reserve.
                            format: double
                            type: number
                        reserveAvailable:
                            description: Size available for snapshots within the snapshot reserve, in bytes.
                            format: int64
                            type: integer
                        reserveAvailablePercent:
                            description: Percentage of snapshot reserve size that is still available.
                            format: double
                            type: number
                        reserveSize:
                            description: Size in the volume that has been set aside as a reserve for snapshot usage, in bytes.
                            format: int64
                            type: integer
                        spaceUsed:
                            description: The total space used by snapshots in the volume, in bytes.
                            format: int64
                            type: integer
                        spaceUsedPercent:
                            description: Percentage of snapshot reserve size that has been used.
                            format: double
                            type: number
                    type: object
                used:
                    description: The virtual space used (includes volume reserves) before storage efficiency, in bytes.
                    format: int64
                    type: integer
                usedPercent:
                    description: The space used, as a percent.
                    format: double
                    type: number
            type: object
