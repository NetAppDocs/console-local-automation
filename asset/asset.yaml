openapi: 3.0.3
components:
    parameters:
        agent_id:
            description: Identifier for an agent.
            example: 1b3f4f06-c05b-4022-8a2a-5c138a5fdbd8
            in: path
            name: agent_id
            required: true
            schema:
                format: uuid
                type: string
        agent_id_filter:
            description: |-
                Specifies filter criteria for listing resources. Use field names and supported operators to match resources. Multiple conditions can be combined.


                Only the `agentId` field is supported for filtering for this resource.


                Supported operators:
                * eq - Equality
                * in - In a list of values


                URL example: "filter=agentId%20eq%20%27value%27"


                OpenAPI examples: "agentId eq 'value'"
            in: query
            name: filter
            schema:
                $ref: '#/components/schemas/query_filter'
        cluster_id:
            description: Cluster UUID or working environment ID of the cluster.
            examples:
                clusterUUID:
                    summary: Cluster UUID
                    value: f8e9d2b4-1a5c-4f7e-9d3b-8c6a5e2f1b9d
                workingEnvironmentId:
                    summary: Working environment ID
                    value: OnPremWorkingEnvironment-KxESQhek
            in: path
            name: cluster_id
            required: true
            schema:
                type: string
        continue:
            description: |-
                Indicates the token to resume from when listing a collection.


                URL examples: "continue=[Continue Token from Collection Metadata]"


                OpenAPI examples: "[Continue Token from Collection Metadata]"
            in: query
            name: continue
            schema:
                $ref: '#/components/schemas/query_continue'
        count:
            description: |-
                Indicates if the total number of resources should be returned in the response object.


                URL examples: "count=true"


                OpenAPI examples: "true"
            in: query
            name: count
            schema:
                $ref: '#/components/schemas/query_count'
        eseriesarray_id:
            description: World Wide Name (WWN) of the E-Series array, used as its globally unique identifier.
            example: 600A0B80006306F400000000674A4DD5
            in: path
            name: eseriesarray_id
            required: true
            schema:
                type: string
        filter:
            description: |-
                Specifies which fields should be matched in order to return a resource when listing a collection.


                Supported operators:
                * eq - Equality
                * lt/gt - Less than/greater than
                * lte/gte - Less than or equal to/greater than or equal to


                URL example: "filter=field%20eq%20%27value%27"


                OpenAPI examples: "field eq 'value'"
            in: query
            name: filter
            schema:
                $ref: '#/components/schemas/query_filter'
        fleet_filter:
            description: |-
                Specifies filter criteria for listing resources. Use field names and supported operators to match resources. Multiple conditions can be combined.

                Only the following fields are supported for filtering:
                * `name`
                * `description`

                Supported operators:
                * eq - Equality
                * in - In a list of values
                * lt/gt - Less than/greater than
                * lte/gte - Less than or equal to/greater than or equal to
                * re - Regular expression match

                URL example: "filter=name%20eq%20%27value%27"

                OpenAPI examples: "name eq 'value'"
            in: query
            name: filter
            schema:
                $ref: '#/components/schemas/query_filter'
        fleet_id:
            description: Identifier for a fleet.
            example: 0980e7e6-3074-4811-b2b3-bbd5131fe8f2
            in: path
            name: fleet_id
            required: true
            schema:
                format: uuid
                type: string
        folder_id:
            description: Identifier for a folder.
            example: 072a4d87-bf77-48af-a8d2-85cc5a76582a
            in: path
            name: folder_id
            required: true
            schema:
                format: uuid
                type: string
        grid_id:
            description: Identifier for a StorageGRID system.
            example: 4cca45b6-1e5a-4c15-b3a6-e29598de9d44
            in: path
            name: grid_id
            required: true
            schema:
                format: uuid
                type: string
        include:
            description: |-
                Specifies which fields should be returned when listing a collection.


                URL examples: "include=id", "include=id,name"


                OpenAPI examples: "id"
            in: query
            name: include
            schema:
                $ref: '#/components/schemas/query_include'
        limit:
            description: |-
                Specifies the maximum number of resources to return when listing a collection.


                URL examples: "limit=2"


                OpenAPI examples: "2"
            in: query
            name: limit
            schema:
                $ref: '#/components/schemas/query_limit'
        metadata:
            description: |-
                Indicates if the metadata should be returned in the response object.


                URL examples: "metadata=true"

                OpenAPI examples: "true"
            in: query
            name: metadata
            schema:
                $ref: '#/components/schemas/query_metadata'
        order_by:
            description: |-
                Indicates the sort order of resources when listing a collection.


                URL examples: "orderBy=name", "orderBy=name%20desc"


                OpenAPI examples: "name desc"
            in: query
            name: orderBy
            schema:
                $ref: '#/components/schemas/query_order_by'
        organization_id:
            description: Identifier for an organization.
            example: be7adfd9-8baa-4548-b7cd-7883986bbb66
            in: path
            name: organization_id
            required: true
            schema:
                format: uuid
                type: string
        project_id:
            description: Identifier for a project.
            example: 698377cd-008c-4672-ae99-ae519b6aaae9
            in: path
            name: project_id
            required: true
            schema:
                format: uuid
                type: string
        skip:
            description: |-
                Specifies the number of resources to skip when listing a collection.


                URL examples: "skip=1"


                OpenAPI examples: "1"
            in: query
            name: skip
            schema:
                $ref: '#/components/schemas/query_skip'
        working_environment_id:
            description: ID of the working environment.
            example: OnPremWorkingEnvironment-KxESQhek
            in: path
            name: working_environment_id
            required: true
            schema:
                type: string
    responses:
        400BadRequest:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The supplied query parameters are invalid.
                        status: "400"
                        title: Invalid query parameters
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Bad Request
        401Unauthorized:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request is missing the required bearer token.
                        status: "401"
                        title: Missing bearer token
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Unauthorized
        403Forbidden:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The requested operation isn't permitted.
                        status: "403"
                        title: Operation not permitted
                        type: https://bluexp.netapp.io/problems/11
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Forbidden
        404NotFound:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The collection specified in the request URI wasn't found.
                        status: "404"
                        title: Collection not found
                        type: https://bluexp.netapp.io/problems/2
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Not Found
        409Conflict:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request body JSON contains a field that conflicts with an idempotent value.
                        status: "409"
                        title: JSON resource conflict
                        type: https://bluexp.netapp.io/problems/10
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Conflict
        413RequestEntityTooLarge:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request entity is too large.
                        status: "413"
                        title: Request entity too large
                        type: https://bluexp.netapp.io/problems/17
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Request Entity Too Large
        429TooManyRequests:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: Too many requests have been made. Please retry later.
                        status: "429"
                        title: Too many requests
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Too Many Requests
        503ServiceNotReady:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The service is not ready to handle requests.
                        status: "503"
                        title: Service not ready
                        type: https://bluexp.netapp.io/problems/15
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Service Not Ready
    schemas:
        aggregate_1.0_get_response_body:
            properties:
                aggregateType:
                    description: |-
                        The type of the aggregate.
                        Defined values are:
                        * "UNIFIED_DATA"
                        * "DISAGGREGATED_DATA"
                        * "STORAGE_AVAILABILITY_ZONE"
                    enum:
                        - UNIFIED_DATA
                        - DISAGGREGATED_DATA
                        - STORAGE_AVAILABILITY_ZONE
                    type: string
                blockStorage:
                    description: Configuration information for the locally attached portion of the aggregate.
                    properties:
                        mirror:
                            description: SyncMirror configuration for the aggregate.
                            properties:
                                enabled:
                                    description: Indicates whether the aggregate is SyncMirror protected.
                                    example: false
                                    type: boolean
                            type: object
                        primary:
                            description: Configuration information for the primary storage portion of the aggregate. This excludes the hybrid cache details.
                            properties:
                                diskType:
                                    description: |-
                                        The type of disk being used by the aggregate.
                                        Defined values are:
                                        * "FC"
                                        * "LUN"
                                        * "NL_SAS"
                                        * "NVME_SSD"
                                        * "SAS"
                                        * "SATA"
                                        * "SCSI"
                                        * "SSD"
                                        * "SSD_CAP"
                                        * "SSD_ZNS"
                                        * "VM_DISK"
                                    enum:
                                        - FC
                                        - LUN
                                        - NL_SAS
                                        - NVME_SSD
                                        - SAS
                                        - SATA
                                        - SCSI
                                        - SSD
                                        - SSD_CAP
                                        - SSD_ZNS
                                        - VM_DISK
                                    type: string
                                raidType:
                                    description: |-
                                        RAID type of the aggregate.
                                        Defined values are:
                                        * "RAID_DP"
                                        * "RAID_EP"
                                        * "RAID_TEC"
                                        * "RAID0"
                                        * "RAID4"
                                        * "MIXED_RAID_TYPE"
                                    enum:
                                        - RAID_DP
                                        - RAID_EP
                                        - RAID_TEC
                                        - RAID0
                                        - RAID4
                                        - MIXED_RAID_TYPE
                                    type: string
                            type: object
                    type: object
                cluster:
                    $ref: '#/components/schemas/cluster_1.0_reference'
                clusterPersonality:
                    description: |-
                        The personality of the ONTAP cluster that the aggregate belongs to, derived from the cluster's disaggregated and SAN-optimized configuration.
                        Defined values are:
                        * "UNIFIED_ONTAP" - A traditional unified ONTAP cluster (not disaggregated).
                        * "ASA_R2" - A disaggregated, SAN-optimized All-Flash SAN Array (ASA) r2 cluster.
                        * "AFX" - A disaggregated cluster that is not SAN-optimized.
                    enum:
                        - UNIFIED_ONTAP
                        - ASA_R2
                        - AFX
                    example: UNIFIED_ONTAP
                    type: string
                diskCount:
                    description: Number of disks in the aggregate.
                    example: 12
                    type: number
                id:
                    description: Identifier of the aggregate.
                    example: c08d213b-3c38-4c07-bde0-852ef821b815
                    format: uuid
                    type: string
                inactiveDataReporting:
                    description: Inactive data reporting configuration for the aggregate.
                    properties:
                        enabled:
                            description: Specifies whether or not inactive data reporting is enabled on the aggregate.
                            type: boolean
                    type: object
                metadata:
                    $ref: '#/components/schemas/common_1.0_inventory_metadata'
                metrics:
                    $ref: '#/components/schemas/aggregate_1.0_metrics'
                name:
                    description: Aggregate name.
                    example: aggregate-01
                    type: string
                node:
                    $ref: '#/components/schemas/node_1.0_reference'
                organizationId:
                    description: Identifier for an organization.
                    example: 9b0ee210-70a0-4158-b025-0decde66e4de
                    format: uuid
                    type: string
                raidGroupCount:
                    description: Number of RAID groups in the aggregate.
                    example: 2
                    type: number
                security:
                    description: Security properties of the aggregate.
                    properties:
                        driveProtectionEnabled:
                            description: Indicates whether the aggregate is encrypted using self-encrypting drives.
                            type: boolean
                        isEncrypted:
                            description: Indicates whether the aggregate is encrypted.
                            type: boolean
                        softwareEncryptionEnabled:
                            description: Indicates whether the aggregate is encrypted using software-based encryption.
                            type: boolean
                    type: object
                snaplockType:
                    description: |-
                        The SnapLock type of the aggregate.
                        Defined values are:
                        * "COMPLIANCE"
                        * "ENTERPRISE"
                        * "NON_SNAPLOCK"
                    enum:
                        - COMPLIANCE
                        - ENTERPRISE
                        - NON_SNAPLOCK
                    type: string
                space:
                    $ref: '#/components/schemas/aggregate_1.0_space'
                state:
                    description: |-
                        The state of the aggregate.
                        Defined values are:
                        * "ONLINE"
                        * "ONLINING"
                        * "OFFLINE"
                        * "OFFLINING"
                        * "RELOCATING"
                        * "UNMOUNTED"
                        * "RESTRICTED"
                        * "INCONSISTENT"
                        * "FAILED"
                        * "UNKNOWN"
                    enum:
                        - ONLINE
                        - ONLINING
                        - OFFLINE
                        - OFFLINING
                        - RELOCATING
                        - UNMOUNTED
                        - RESTRICTED
                        - INCONSISTENT
                        - FAILED
                        - UNKNOWN
                    example: ONLINE
                    type: string
                type:
                    description: |-
                        Media type of the resource.
                        Defined values are:
                          * "application/vnd.netapp.bxp.aggregate"
                    enum:
                        - application/vnd.netapp.bxp.aggregate
                    example: application/vnd.netapp.bxp.aggregate
                    type: string
                version:
                    description: |-
                        Version of the resource.
                        Defined values are:
                        * "1.0"
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
                volumeCount:
                    description: Number of volumes in the aggregate.
                    example: 35
                    type: number
                workingEnvironmentId:
                    description: Identifier for the asset's systems.
                    example: OnPremWorkingEnvironment-KxESQhek
                    type: string
            type: object
        aggregate_1.0_list_response_body:
            properties:
                count:
                    description: Total number of resources in the collection that match the query.
                    example: 1
                    format: int64
                    minimum: 0
                    type: integer
                items:
                    description: Aggregates in the collection.
                    items:
                        $ref: '#/components/schemas/aggregate_1.0_get_response_body'
                    type: array
                    uniqueItems: true
            required:
                - items
            type: object
        aggregate_1.0_metrics:
            properties:
                iops:
                    description: IOPS metrics for the aggregate.
                    properties:
                        total:
                            description: The rate of I/O operations observed at the storage object.
                            format: double
                            type: number
                    type: object
                latency:
                    description: Latency metrics for the aggregate.
                    properties:
                        average:
                            description: The average round trip latency observed at the storage object, in microseconds.
                            format: double
                            type: number
                    type: object
                modeledIops:
                    description: The total expected IOPS consumption for the aggregate.
                    example: 50000
                    format: double
                    type: number
                modeledIopsAvailable:
                    description: The remaining expected IOPS capacity available on the aggregate.
                    example: 35000
                    format: double
                    type: number
                throughput:
                    description: Throughput metrics for the aggregate.
                    properties:
                        total:
                            description: The rate of throughput observed at the storage object, in bytes per second.
                            format: double
                            type: number
                    type: object
            type: object
        aggregate_1.0_reference:
            description: Reference to an ONTAP aggregate.
            properties:
                id:
                    description: Identifier of the aggregate.
                    example: 1b18483c-2b4e-411b-b9ea-528e49dde9d2
                    format: uuid
                    type: string
                name:
                    description: Aggregate name.
                    example: aggregate1
                    type: string
            type: object
            x-tag: Aggregate
        aggregate_1.0_space:
            properties:
                blockStorage:
                    description: Capacity information for the aggregate's local block storage.
                    properties:
                        available:
                            description: Space available in bytes.
                            format: int64
                            type: integer
                        availablePercent:
                            description: The space available, as a percent.
                            format: double
                            type: number
                        size:
                            description: Total usable space in bytes, not including WAFL reserve and aggregate snapshot reserve.
                            format: int64
                            type: integer
                        used:
                            description: Space used or reserved in bytes. Includes volume guarantees and aggregate metadata.
                            format: int64
                            type: integer
                        usedPercent:
                            description: The space used, as a percent.
                            format: double
                            type: number
                    type: object
                cloudStorage:
                    description: Capacity information for cloud storage attached to the aggregate.
                    properties:
                        cloudTargetCount:
                            description: Number of cloud tiers configured for the aggregate.
                            example: 2
                            format: int64
                            type: integer
                        used:
                            description: Used space in the cloud stores, in bytes.
                            format: int64
                            type: integer
                    type: object
                efficiencyWithoutSnapshots:
                    description: Storage efficiency that does not include the savings provided by snapshots.
                    properties:
                        logicalUsed:
                            description: The logical used space, in bytes.
                            format: int64
                            type: integer
                        ratio:
                            description: Data reduction ratio (logical_used / used)
                            format: double
                            type: number
                    type: object
                overcommittedPercentage:
                    description: The percentage by which total volume commitments exceed the aggregate's physical capacity.
                    format: double
                    type: number
                snapshot:
                    description: Snapshot reserve capacity information for the aggregate.
                    properties:
                        available:
                            description: Available space for snapshots in bytes.
                            format: int64
                            type: integer
                        availablePercent:
                            description: Available space for snapshots, as a percent.
                            format: double
                            type: number
                        total:
                            description: Total space for snapshots in bytes.
                            format: int64
                            type: integer
                        used:
                            description: Space used by snapshots in bytes.
                            format: int64
                            type: integer
                        usedPercent:
                            description: Percentage of disk space used by snapshots.
                            format: double
                            type: number
                    type: object
            type: object
        asset_1.0_get_response_body:
            properties:
                agentId:
                    description: Identifier for the Console agent.
                    example: 75fed73a-0904-4f9c-8c19-a51dbcf95abb
                    type: string
                assetType:
                    description: |-
                        Type of asset.
                        Defined values are:
                          * "ONTAP_CLUSTER"
                    enum:
                        - ONTAP_CLUSTER
                    example: ONTAP_CLUSTER
                    type: string
                attributes:
                    additionalProperties:
                        type: string
                    description: A JSON object containing key-value pairs that define the asset's attributes.  Each key represents the name of an attribute, and each value is the corresponding attribute value.  Both keys and values must be strings.
                    example:
                        clusterName: test-cluster-1
                        clusterUuid: 12345678-1234-5678-1234-567812345678
                        ontapVersion: 9.16.1
                    type: object
                id:
                    description: Globally unique identifier of the resource conforming to the UUIDv4 schema.
                    example: 4336388b-2992-43af-81de-ba9284b7dc36
                    format: uuid
                    type: string
                legacyAgentId:
                    description: Legacy identifier for the Console agent.
                    example: zceJRb1Z16WZzcKjLkitxHuCp5vTV0HEclients
                    type: string
                metadata:
                    $ref: '#/components/schemas/type_bxp_metadata'
                metrics:
                    additionalProperties:
                        format: double
                        type: number
                    description: A JSON object containing key-value pairs that define the asset's metrics.  Each key represents the name of a metric, and each value is the corresponding metric value.  Keys must be strings and values must an integer or floating point number.
                    example:
                        capacityTotal: 9876543210
                        capacityUsed: 1234567890
                        capacityUsedPercent: 0.02
                    type: object
                organizationId:
                    description: Identifier for an organization.
                    example: 9b0ee210-70a0-4158-b025-0decde66e4de
                    format: uuid
                    type: string
                resourceClass:
                    description: The resource class of the system.
                    example: ON_PREM
                    type: string
                resourceType:
                    description: The resource type of the system.
                    example: ON_PREM
                    type: string
                type:
                    description: |-
                        Media type of the resource.
                        Defined values are:
                          * "application/vnd.netapp.bxp.asset"
                    enum:
                        - application/vnd.netapp.bxp.asset
                    example: application/vnd.netapp.bxp.asset
                    type: string
                version:
                    description: |-
                        Version of the resource.
                        Defined values are:
                        * "1.0"
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
                workingEnvironmentId:
                    description: Identifier for the asset's system.
                    example: OnPremWorkingEnvironment-KxESQhek
                    type: string
            type: object
        asset_1.0_list_response_body:
            properties:
                count:
                    description: Total number of resources in the collection that match the query.
                    example: 1
                    format: int64
                    minimum: 0
                    type: integer
                items:
                    description: Assets in the collection.
                    items:
                        $ref: '#/components/schemas/asset_1.0_get_response_body'
                    type: array
                    uniqueItems: true
            required:
                - items
            type: object
        asset_1.0_patch_request_body:
            properties:
                items:
                    description: Array of JSON objects each representing a single asset.
                    items:
                        properties:
                            assetType:
                                description: |-
                                    Type of asset.
                                    Defined values are:
                                      * "ONTAP_CLUSTER"
                                enum:
                                    - ONTAP_CLUSTER
                                example: ONTAP_CLUSTER
                                type: string
                            attributes:
                                additionalProperties:
                                    nullable: true
                                    type: string
                                description: A JSON object containing key-value pairs that define the asset's attributes.  Each key represents the name of an attribute, and each value is the corresponding attribute value.  Both keys and values must be strings. Only the attributes that are specified will be updated. To remove an attribute, set its value to null.
                                example:
                                    clusterName: test-cluster-1
                                    clusterUuid: 12345678-1234-5678-1234-567812345678
                                    ontapVersion: 9.16.1
                                type: object
                            metrics:
                                additionalProperties:
                                    format: double
                                    nullable: true
                                    type: number
                                description: A JSON object containing key-value pairs that define the asset's metrics.  Each key represents the name of a metric, and each value is the corresponding metric value.  Keys must be strings and values must an integer or floating point number. Only the metrics that are specified will be updated. To remove a metric, set its value to null.
                                example:
                                    capacityTotal: 9876543210
                                    capacityUsed: 1234567890
                                    capacityUsedPercent: 0.02
                                type: object
                            type:
                                description: |-
                                    Media type of the resource.
                                    Defined values are:
                                      * "application/vnd.netapp.bxp.asset"
                                enum:
                                    - application/vnd.netapp.bxp.asset
                                example: application/vnd.netapp.bxp.asset
                                type: string
                            version:
                                description: |-
                                    Version of the resource.
                                    Defined values are:
                                    * "1.0"
                                enum:
                                    - "1.0"
                                example: "1.0"
                                type: string
                        required:
                            - assetType
                            - attributes
                            - metrics
                        type: object
                    minItems: 1
                    type: array
                    uniqueItems: true
            required:
                - items
            type: object
        asset_1.0_post_request_body:
            description: Protobuf request body for creating assets. This schema is a placeholder for code generation purposes.
            type: object
        asset_1.0_time_range:
            description: |-
                Time range for a query window. If omitted from the request body,
                an instant query is performed at the evaluation time. If provided in the request body, a range query is performed. Values can be absolute or relative to the
                evaluation time.
            properties:
                end:
                    default: NOW
                    description: |-
                        End of the query window. The value can be:
                        - RFC 3339 timestamp (e.g. "2026-01-23T10:00:00Z"),
                        - "NOW",
                        - ISO 8601 duration interpreted as NOW minus the duration
                          (e.g. "PT15M" = NOW-15 minutes).
                        If omitted, defaults to "NOW".
                    example: NOW
                    type: string
                start:
                    description: |-
                        Start of the query window. The value can be:
                        - RFC 3339 timestamp (e.g. "2026-01-23T10:00:00Z"),
                        - "NOW",
                        - ISO 8601 duration interpreted as NOW minus the duration
                          (e.g. "PT15M" = NOW-15 minutes).
                    example: PT15M
                    type: string
