        timeseries_1.0_post_request_body:
            properties:
                singleMetric:
                    description: Configuration for a query against a single metric.
                    properties:
                        aggregation:
                            description: Aggregation function applied to the series.
                            enum:
                                - SUM
                                - MIN
                                - MAX
                                - AVERAGE
                                - COUNT
                            example: SUM
                            type: string
                        filters:
                            description: Label filters applied before aggregation.
                            items:
                                properties:
                                    label:
                                        description: Label key to filter on.
                                        example: cluster
                                        type: string
                                    operator:
                                        description: Filter operator.
                                        enum:
                                            - EQUAL
                                            - NOT_EQUAL
                                            - REGEX_MATCH
                                            - REGEX_NOT_MATCH
                                        example: REGEX_MATCH
                                        type: string
                                    values:
                                        description: |-
                                            Label values to compare against.
                                            Multiple values are only supported for `REGEX_MATCH` and `REGEX_NOT_MATCH` operators.
                                            Multiple values are combined with logical OR.
                                        example:
                                            - cluster-01
                                            - cluster-02
                                        items:
                                            type: string
                                        minItems: 1
                                        type: array
                                required:
                                    - label
                                    - operator
                                    - values
                                type: object
                            type: array
                        forecast:
                            description: Configuration for forecasting values using linear interpolation.
                            properties:
                                horizon:
                                    description: |-
                                        ISO 8601 duration into the future (e.g. "PT60S") relative to
                                        the evaluation time.

                                        The maximum allowed horizon is 30 days.
                                    example: P30D
                                    type: string
                                lookbackWindow:
                                    description: |-
                                        ISO 8601 duration lookbehind window (e.g. "PT5M") used over
                                        raw samples for linear interpolation.
                                    example: P90D
                                    type: string
                                step:
                                    description: |-
                                        Interval between forecasted data points in ISO 8601 duration format.

                                        If omitted, only a single forecasted value is generated at the end of the forecast horizon.

                                        When provided, a forecasted value is generated at every interval between the evaluation time
                                        (exclusive) and the end of the forecast horizon (inclusive).

                                        When step is provided, the maximum allowed forecast horizon will be determined by how much data
                                        is available within the lookback window. The limits are:
                                        * `< 1 week` - No forecast is allowed.
                                        * `1 - 2 weeks` - Maximum horizon is 2 weeks
                                        * `> 2 weeks` - Maximum horizon is 4 weeks
                                    example: P7D
                                    type: string
                            required:
                                - horizon
                                - lookbackWindow
                            type: object
                        groupBy:
                            description: Label keys to group series by.
                            example:
                                - cluster
                                - datacenter
                            items:
                                type: string
                            type: array
                        metric:
                            description: Metric name to query.
                            example: size_used
                            type: string
                        rollup:
                            description: |-
                                Per-series rollup function evaluated over a sliding window at each query step,
                                before any outer `aggregation` or `sort` is applied.
                            properties:
                                function:
                                    description: |-
                                        Rollup function to apply to each series over the lookback window.
                                        Defined values are:
                                        * `MAX_OVER_TIME` - maximum value over the lookback window
                                        * `MIN_OVER_TIME` - minimum value over the lookback window
                                        * `AVG_OVER_TIME` - average value over the lookback window
                                        * `SUM_OVER_TIME` - sum of values over the lookback window
                                        * `COUNT_OVER_TIME` - count of samples over the lookback window
                                    enum:
                                        - MAX_OVER_TIME
                                        - MIN_OVER_TIME
                                        - AVG_OVER_TIME
                                        - SUM_OVER_TIME
                                        - COUNT_OVER_TIME
                                    example: MAX_OVER_TIME
                                    type: string
                                window:
                                    description: ISO 8601 duration lookback window evaluated at each query step. Must be greater than zero.
                                    example: PT5M
                                    type: string
                            required:
                                - function
                                - window
                            type: object
                        sort:
                            description: |-
                                Sort series based on average value and limit the number of returned series. This is used for retrieving
                                the top or bottom N series for a given metric.
                            properties:
                                limit:
                                    description: Maximum number of series to return.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                order:
                                    description: |-
                                        Sort order.

                                        Defined values are:
                                        * "ASC" - ascending order - This results in the bottom `limit` series returned.
                                        * "DESC" - descending order - This results in the top `limit` series returned.
                                    enum:
                                        - ASC
                                        - DESC
                                    type: string
                            required:
                                - order
                                - limit
                            type: object
                        valueFilter:
                            description: Numeric value filter applied to each sample before the aggregation function is evaluated.
                            properties:
                                operator:
                                    description: |-
                                        Comparison operator applied to each sample value against the threshold.

                                        Defined values are:
                                        * `EQ`  - equal (`==`)
                                        * `NE`  - not equal (`!=`)
                                        * `LT`  - less than (`<`)
                                        * `GT`  - greater than (`>`)
                                        * `LTE` - less than or equal (`<=`)
                                        * `GTE` - greater than or equal (`>=`)
                                    enum:
                                        - EQ
                                        - NE
                                        - LT
                                        - GT
                                        - LTE
                                        - GTE
                                    example: EQ
                                    type: string
                                threshold:
                                    description: The numeric constant to compare each sample value against.
                                    example: 0
                                    format: double
                                    type: number
                            required:
                                - operator
                                - threshold
                            type: object
                    required:
                        - metric
                    type: object
                timeRange:
                    $ref: '#/components/schemas/asset_1.0_time_range'
            required:
                - singleMetric
            type: object
