    /organizations/{organization_id}/timeseries:
        parameters:
            - $ref: '#/components/parameters/organization_id'
        post:
            description: Retrieve time series data for systems in an organization.
            requestBody:
                content:
                    application/vnd.netapp.bxp.timeseries+json:
                        examples:
                            avgOverTime:
                                summary: Average IOPS over 10-minute window
                                value:
                                    singleMetric:
                                        metric: iops_total
                                        rollup:
                                            function: AVG_OVER_TIME
                                            window: PT10M
                                    timeRange:
                                        end: NOW
                                        start: PT2H
                                        step: PT10M
                            countMetricByValueFilter:
                                summary: Count series where value equals 0
                                value:
                                    singleMetric:
                                        aggregation: COUNT
                                        metric: cluster_new_status
                                        valueFilter:
                                            operator: EQ
                                            threshold: 0
                                    timeRange:
                                        end: NOW
                                        start: PT15M
                                        step: PT60S
                            countOverTime:
                                summary: Count of samples over 1-hour window
                                value:
                                    singleMetric:
                                        metric: cluster_health_score
                                        rollup:
                                            function: COUNT_OVER_TIME
                                            window: PT1H
                                    timeRange:
                                        end: NOW
                                        start: PT12H
                                        step: PT1H
                            maxOverTimeWithTopK:
                                summary: Top 5 series by max value over window
                                value:
                                    singleMetric:
                                        metric: volume_avg_latency
                                        rollup:
                                            function: MAX_OVER_TIME
                                            window: PT5M
                                        sort:
                                            limit: 5
                                            order: DESC
                                    timeRange:
                                        end: NOW
                                        start: PT1H
                                        step: PT5M
                            metricWithFilters:
                                summary: Single Metric with 2 filters using equals and regex
                                value:
                                    singleMetric:
                                        filters:
                                            - label: cluster
                                              operator: EQUAL
                                              values:
                                                - cluster-01
                                            - label: svm
                                              operator: REGEX_MATCH
                                              values:
                                                - svm-prod-.*
                                        metric: iops_read
                                    timeRange:
                                        end: "2026-01-23T11:00:00Z"
                                        start: "2026-01-23T10:00:00Z"
                                        step: PT5M
                            metricWithForecast:
                                summary: Single Metric with forecasting
                                value:
                                    singleMetric:
                                        forecast:
                                            horizon: PT1H
                                            lookbackWindow: PT24H
                                        metric: size_used
                            metricWithForecastStep:
                                summary: Single Metric with forecasting and step
                                value:
                                    singleMetric:
                                        forecast:
                                            horizon: P30D
                                            lookbackWindow: P90D
                                            step: P7D
                                        metric: size_used
                            metricWithGroupByAndAggregation:
                                summary: Single Metric with group by and SUM aggregation
                                value:
                                    singleMetric:
                                        aggregation: SUM
                                        groupBy:
                                            - cluster
                                            - svm
                                        metric: bytes_written
                                    timeRange:
                                        end: NOW
                                        start: PT1H
                                        step: PT5M
                            metricWithTop5Sort:
                                summary: Single Metric with top 5 using sort
                                value:
                                    singleMetric:
                                        aggregation: SUM
                                        groupBy:
                                            - cluster
                                        metric: size_used
                                        sort:
                                            limit: 5
                                            order: DESC
                                    timeRange:
                                        end: NOW
                                        start: PT30M
                                        step: PT1M
                            minOverTime:
                                summary: Minimum latency over 5-minute window
                                value:
                                    singleMetric:
                                        metric: volume_avg_latency
                                        rollup:
                                            function: MIN_OVER_TIME
                                            window: PT5M
                                    timeRange:
                                        end: NOW
                                        start: PT1H
                                        step: PT5M
                            singleMetricAbsoluteTimeRange:
                                summary: Single Metric with Absolute Time Range
                                value:
                                    singleMetric:
                                        metric: size_used
                                    timeRange:
                                        end: "2026-01-23T10:15:00Z"
                                        start: "2026-01-23T10:00:00Z"
                                        step: PT60S
                            singleMetricRelativeTimeRange:
                                summary: Single Metric with Relative Time Range
                                value:
                                    singleMetric:
                                        metric: size_used
                                    timeRange:
                                        end: NOW
                                        start: PT15M
                                        step: PT60S
                            sumOverTime:
                                summary: Sum of bytes written over 15-minute window
                                value:
                                    singleMetric:
                                        metric: bytes_written
                                        rollup:
                                            function: SUM_OVER_TIME
                                            window: PT15M
                                    timeRange:
                                        end: NOW
                                        start: PT24H
                                        step: PT15M
                        schema:
                            $ref: '#/components/schemas/timeseries_1.0_post_request_body'
                required: true
