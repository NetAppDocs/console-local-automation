        query_continue:
            description: Format of the continue query parameter.
            pattern: ^([A-Za-z0-9+/]{4})*(([A-Za-z0-9+/]{2})==|([A-Za-z0-9+/]{3})=)?$
            type: string
            x-common: true
        query_count:
            description: Format of the count query parameter.
            pattern: ^true$
            type: string
            x-common: true
        query_filter:
            description: Format of the filter query parameter.
            pattern: ^(([0-9a-zA-Z]+(\[\*\])?)((\.[0-9a-zA-Z]+(\[\*\])?)+)? (eq|lt|gt|lte|gte|in) '([0-9a-zA-Z.,-_:@ {}\"])+')(,(\1))*$
            type: string
            x-common: true
        query_include:
            description: Format of the include query parameter.
            pattern: ^([0-9a-zA-Z]+)(,[0-9a-zA-Z]+)*$
            type: string
            x-common: true
        query_limit:
            description: Format of the limit query parameter.
            pattern: ^([1-9][0-9]*)$
            type: string
            x-common: true
        query_metadata:
            description: Format of the metadata query parameter.
            pattern: ^(true|false)$
            type: string
        query_order_by:
            description: Format of the order_by query parameter.
            pattern: ^(([0-9a-zA-Z]+)( desc)?)$
            type: string
            x-common: true
        query_skip:
            description: Format of the skip query parameter.
            pattern: ^([1-9][0-9]*)$
            type: string
            x-common: true
