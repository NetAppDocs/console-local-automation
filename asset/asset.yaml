        post:
            description: Runs a raw MetricsQL query against time series data for systems in the specified fleet.
            requestBody:
                content:
                    application/vnd.netapp.bxp.metricsql+json:
                        examples:
                            aggregationQuery:
                                summary: Sum of IOPS grouped by cluster
                                value:
                                    query: sum(iops_total) by (cluster)
                                    timeRange:
                                        end: NOW
                                        start: PT30M
                                        step: PT1M
                            forecastQuery:
                                summary: Predict future size_used using linear regression
                                value:
                                    query: predict_linear(size_used[7d], 86400)
                            instantQuery:
                                summary: Instant query — single metric at evaluation time
                                value:
                                    query: size_used
                            rangeQueryAbsoluteTime:
                                summary: Range query with absolute time range
                                value:
                                    query: iops_read + iops_write
                                    timeRange:
                                        end: "2026-01-23T11:00:00Z"
                                        start: "2026-01-23T10:00:00Z"
                                        step: PT5M
                            rangeQueryRelativeTime:
                                summary: Range query with relative time range
                                value:
                                    query: max_over_time(size_used[5m])
                                    timeRange:
                                        end: NOW
                                        start: PT1H
                                        step: PT5M
                            topKQuery:
                                summary: Top 5 volumes by average latency over a 5-minute window
                                value:
                                    query: topk(5, avg_over_time(volume_avg_latency[5m]))
                                    timeRange:
                                        end: NOW
                                        start: PT1H
                                        step: PT5M
