                        type: string
                    type: array
                id:
                    description: Identifier of the cluster.
                    example: c08d213b-3c38-4c07-bde0-852ef821b815
                    format: uuid
                    type: string
                isAllFlashOptimized:
                    description: Specifies whether the cluster is all flash optimized.
                    example: true
                    type: boolean
                isDisaggregated:
                    description: Indicates whether the cluster uses a disaggregated architecture, where storage and compute are separated.
                    example: false
                    type: boolean
                isSanOptimized:
                    description: Indicates whether the cluster is optimized for SAN workloads.
                    example: false
                    type: boolean
                location:
                    description: Location of the cluster.
                    example: data center
                    type: string
                managementInterfaces:
                    description: List of management interface IP addresses (IPv4 and IPV6).
