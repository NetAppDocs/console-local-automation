info:
    description: |-
        The Assets service provides configuration data and metrics about assets monitored by the NetApp Console (local deployment).

        The following resources are defined within Assets:
        <ul>
        <li>aggregate</li>
        <li>cluster</li>
        <li>fleet</li>
        <li>LUN</li>
        <li>namespace</li>
        <li>network interface</li>
        <li>node</li>
        <li>port</li>
        <li>QoS policy group</li>
        <li>qtree</li>
        <li>SMB share</li>
        <li>Storage VM (SVM)</li>
        <li>volume</li>
        </ul>

        **Note**: Before using the API reference documentation, review the
        [Get started](https://docs.netapp.com/us-en/console-local-automation/platform/learn-about.html) section for the
        Console (local deployment) APIs.

        ---

        ## Query parameters

        You can use query parameters with endpoints in the following resources:

        | Resource           | Query Parameter                                    |
        |--------------------|----------------------------------------------------|
        | Aggregate          | count, filter, include, limit, metadata, orderBy, skip |
        | Cluster            | count, filter, include, limit, metadata, orderBy, skip |
        | Fleet              | count, filter, limit, orderBy, skip                    |
        | LUN                | count, filter, include, limit, metadata, orderBy, skip |
        | Namespace          | count, filter, include, limit, metadata, orderBy, skip |
        | Network Interface  | count, filter, include, limit, metadata, orderBy, skip |
        | Node               | count, filter, include, limit, metadata, orderBy, skip |
        | Port               | count, filter, include, limit, metadata, orderBy, skip |
        | QoS Policy Group   | count, filter, include, limit, metadata, orderBy, skip |
        | Qtree              | count, filter, include, limit, metadata, orderBy, skip |
        | SMB Share          | count, filter, include, limit, metadata, orderBy, skip |
        | Storage VM (SVM)   | count, filter, include, limit, metadata, orderBy, skip |
        | Volume             | count, filter, include, limit, metadata, orderBy, skip |

    license:
        name: NetApp Console License
    termsOfService: https://www.netapp.com/media/10784-cloud-data-services-terms.pdf
    title: (ncl) Assets API
    version: "1.0"
