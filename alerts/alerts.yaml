                                    * NVME_NAMESPACE
                                    * SNAPMIRROR
                                    * CIFS_SHARE
                                    * NFS_SHARE
                                    * CONNECTOR
                                    * CONNECTOR_CONTAINER
                                    * MSSQL_HOST
                                    * ORACLE_HOST
                                enum:
