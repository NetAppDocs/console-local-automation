openapi: 3.0.3
components:
    parameters:
        continue:
            description: |-
                Indicates the token to resume from when listing a collection.


                URL examples: "continue=[Continue Token from Collection Metadata]"


                OpenAPI examples: "[Continue Token from Collection Metadata]"
            in: query
            name: continue
            schema:
                $ref: '#/components/schemas/query_continue'
        count:
            description: |-
                Indicates if the total number of resources should be returned in the response object.


                URL examples: "count=true"


                OpenAPI examples: "true"
            in: query
            name: count
            schema:
                $ref: '#/components/schemas/query_count'
        filter:
            description: |-
                Specifies which fields should be matched in order to return a resource when listing a collection.


                Supported operators:
                * eq - Equality
                * lt/gt - Less than/greater than
                * lte/gte - Less than or equal to/greater than or equal to


                URL example: "filter=field%20eq%20%27value%27"


                OpenAPI examples: "field eq 'value'"
            in: query
            name: filter
            schema:
                $ref: '#/components/schemas/query_filter'
        fleet_id:
            description: Unique identifier of the fleet.
            example: 123e4567-e89b-12d3-a456-426614174000
            in: path
            name: fleet_id
            required: true
            schema:
                type: string
        include:
            description: |-
                Specifies which fields should be returned when listing a collection.


                URL examples: "include=id", "include=id,name"


                OpenAPI examples: "id"
            in: query
            name: include
            schema:
                $ref: '#/components/schemas/query_include'
        limit:
            description: |-
                Specifies the maximum number of resources to return when listing a collection.


                URL examples: "limit=2"


                OpenAPI examples: "2"
            in: query
            name: limit
            schema:
                $ref: '#/components/schemas/query_limit'
        metadata:
            description: |-
                Indicates if the metadata should be returned in the response object.


                URL examples: "metadata=true"

                OpenAPI examples: "true"
            in: query
            name: metadata
            schema:
                $ref: '#/components/schemas/query_metadata'
        order_by:
            description: |-
                Indicates the sort order of resources when listing a collection.


                URL examples: "orderBy=name", "orderBy=name%20desc"


                OpenAPI examples: "name desc"
            in: query
            name: orderBy
            schema:
                $ref: '#/components/schemas/query_order_by'
        organization_id:
            description: Unique identifier of the organization to which the user belongs.
            example: 3b44d359-d125-4665-b605-49d72c2dd7be
            in: path
            name: organization_id
            required: true
            schema:
                type: string
        skip:
            description: |-
                Specifies the number of resources to skip when listing a collection.


                URL examples: "skip=1"


                OpenAPI examples: "1"
            in: query
            name: skip
            schema:
                $ref: '#/components/schemas/query_skip'
        system_id:
            description: Unique identifier of the system.
            example: 123e4567-e89b-12d3-a456-426614174001
            in: path
            name: system_id
            required: true
            schema:
                type: string
    responses:
        400BadRequest:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The supplied query parameters are invalid.
                        status: "400"
                        title: Invalid query parameters
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Bad Request
        401Unauthorized:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request is missing the required bearer token.
                        status: "401"
                        title: Missing bearer token
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Unauthorized
        403Forbidden:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The requested operation isn't permitted.
                        status: "403"
                        title: Operation not permitted
                        type: https://bluexp.netapp.io/problems/11
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Forbidden
        404NotFound:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The collection specified in the request URI wasn't found.
                        status: "404"
                        title: Collection not found
                        type: https://bluexp.netapp.io/problems/2
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Not Found
        409Conflict:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request body JSON contains a field that conflicts with an idempotent value.
                        status: "409"
                        title: JSON resource conflict
                        type: https://bluexp.netapp.io/problems/10
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Conflict
        413RequestEntityTooLarge:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The request entity is too large.
                        status: "413"
                        title: Request entity too large
                        type: https://bluexp.netapp.io/problems/17
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Request Entity Too Large
        429TooManyRequests:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: Too many requests have been made. Please retry later.
                        status: "429"
                        title: Too many requests
                        type: https://bluexp.netapp.io/problems/1
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Too Many Requests
        503ServiceNotReady:
            content:
                application/vnd.netapp.bxp.problem+json:
                    example:
                        detail: The service is not ready to handle requests.
                        status: "503"
                        title: Service not ready
                        type: https://bluexp.netapp.io/problems/15
                    schema:
                        $ref: '#/components/schemas/type_bxp_problem_detail'
            description: Service Not Ready
    schemas:
        alert_1.0_alert_agent_get_response_body:
            additionalProperties: false
            properties:
                agentId:
                    description: |-
                        Globally unique identifier of the agent (Connector) that is reporting this
                        data.
                    example: 333a3f38-a4fa-4e32-a371-a37027748a32
                    type: string
                errorCode:
                    description: A code to help identify the cause of the problem.
                    enum:
                        - AGENT_OVER_PROVISIONED
                    example: AGENT_OVER_PROVISIONED
                    type: string
                organizationId:
                    description: Unique identifier of the organization to which the alerts belongs.
                    example: 3b44d359-d125-4665-b605-49d72c2dd7be
                    type: string
                state:
                    description: State of the agent.
                    enum:
                        - MONITORING_ALL_CLUSTERS
                        - MONITORING_SUBSET_OF_CLUSTERS
                    example: MONITORING_ALL_CLUSTERS
                    type: string
                systemConfiguration:
                    properties:
                        cpuCores:
                            description: Number of CPU cores available on this agent.
                            example: 8
                            type: int
                        memoryInGB:
                            description: Available memory on this agent, in GB.
                            example: 32
                            type: int
                    required:
                        - cpuCores
                        - memoryInGB
                    type: object
            required:
                - organizationId
                - agentId
                - systemConfiguration
                - state
            type: object
        alert_1.0_alert_agent_list_response_body:
            properties:
                activeAgentsWithErrors:
                    description: Number of agents with problems related to Harvest pollers.
                    example: 1
                    format: int64
                    minimum: 0
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/alert_1.0_alert_agent_get_response_body'
                    type: array
                    uniqueItems: true
                metadata:
                    $ref: '#/components/schemas/type_bxp_metadata_list'
            required:
                - items
                - metadata
            type: object
        alert_1.0_alert_agent_patch_list_request_body:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/alert_1.0_alert_agent_patch_request_body'
                    type: array
                    uniqueItems: true
            required:
                - items
            type: object
        alert_1.0_alert_agent_patch_request_body:
            properties:
                agentId:
                    description: |-
                        Globally unique identifier of the agent (Connector) that is reporting this
                        data.
                    example: 333a3f38-a4fa-4e32-a371-a37027748a32
                    type: string
                errorCode:
                    description: A code to help identify the cause of the problem.
                    enum:
                        - AGENT_OVER_PROVISIONED
                    example: AGENT_OVER_PROVISIONED
                    type: string
                organizationId:
                    description: Unique identifier of the organization to which the alerts belongs.
                    example: 3b44d359-d125-4665-b605-49d72c2dd7be
                    type: string
                state:
                    description: State of the agent.
                    enum:
                        - MONITORING_ALL_CLUSTERS
                        - MONITORING_SUBSET_OF_CLUSTERS
                    example: MONITORING_ALL_CLUSTERS
                    type: string
                systemConfiguration:
                    properties:
                        cpuCores:
                            description: Number of CPU cores available on this agent.
                            example: 8
                            type: int
                        memoryInGB:
                            description: Available memory on this agent, in GB.
                            example: 32
                            type: int
                    required:
                        - cpuCores
                        - memoryInGB
                    type: object
            required:
                - organizationId
                - agentId
                - systemConfiguration
                - state
            type: object
        alert_1.0_get_response_body:
            additionalProperties: false
            properties:
                alertDetails:
                    description: Details about the condition or situation that triggered this alert.
                    example: Volume Vol1 is 90% used
                    type: string
                alertId:
                    description: Globally unique identifier of the resource, generated and assigned by the client service.
                    example: 666a3f38-d4fa-5b62-a391-a69029758d32
                    type: string
                alertObjectId:
                    description: Unique identifier of the resource for which this alert is raised.
                    example: 666a3f38-d4fa-5b62-a391-a69029758d32
                    type: string
                alertObjectName:
                    description: The name of the object on which the alert is raised.
                    example: Volume1
                    type: string
                alertObjectType:
                    description: |-
                        Type of the object on which the alert is raised. Defined values are:
                        * CLUSTER
                        * NODE
                        * AGGREGATE
                        * SVM
                        * VOLUME
                        * LUN
                        * DISK
                        * QTREE
                        * NVME_NAMESPACE
                        * SNAPMIRROR
                        * CIFS_SHARE
                        * NFS_SHARE
                        * CONNECTOR
                        * CONNECTOR_CONTAINER
                        * MSSQL_HOST
                        * ORACLE_HOST
                    enum:
                        - CLUSTER
                        - NODE
                        - AGGREGATE
                        - SVM
                        - VOLUME
                        - LUN
                        - DISK
                        - QTREE
                        - NVME_NAMESPACE
                        - SNAPMIRROR
                        - CIFS_SHARE
                        - NFS_SHARE
                        - CONNECTOR
                        - CONNECTOR_CONTAINER
                        - MSSQL_HOST
                        - ORACLE_HOST
                    example: CLUSTER
                    type: string
                associatedObjects:
                    description: |-
                        JSON array of one or multiple contextual parent objects that might require remediation.
                        For example, an alert on a volume for an issue with junction path should populate this field with the SVM details because remediation has to be performed on the SVM.
                        Conversely, an alert on volume for low capacity should populate this field with the node details because remediation has to be performed on the node.
                    items:
                        properties:
                            objectId:
                                description: Unique identifier of the resource for which this alert is raised.
                                example: 666a3f38-d4fa-5b62-a391-a69029758d32
                                type: string
                            objectName:
                                description: The name of the object that is associated with the object on which the alert is raised.
                                type: string
                            objectType:
                                description: |-
                                    Type of the object on which the alert is raised. Defined values are:

                                     * CLUSTER

                                     * NODE

                                     * AGGREGATE

                                     * SVM

                                     * VOLUME

                                     * LUN

                                     * DISK

                                     * QTREE

                                     * NVME_NAMESPACE

                                     * SNAPMIRROR

                                     * CIFS_SHARE

                                     * NFS_SHARE

                                     * CONNECTOR

                                     * CONNECTOR_CONTAINER

                                     * MSSQL_HOST

                                     * ORACLE_HOST
                                enum:
                                    - CLUSTER
                                    - NODE
                                    - AGGREGATE
                                    - SVM
                                    - VOLUME
                                    - LUN
                                    - DISK
                                    - QTREE
                                    - NVME_NAMESPACE
                                    - SNAPMIRROR
                                    - CIFS_SHARE
                                    - NFS_SHARE
                                    - CONNECTOR
                                    - CONNECTOR_CONTAINER
                                    - MSSQL_HOST
                                    - ORACLE_HOST
                                type: string
                        type: object
                    type: array
                    uniqueItems: true
                closedOn:
                    description: The time that the alert was closed.
                    example: "2022-10-09T20:58:16.305Z"
                    format: date-time
                    type: string
                description:
                    description: JSON string explaining the alert condition in detail.
                    example: AutoSupport supports HTTPS, HTTP, and SMTP for transport protocols. Because of the sensitive nature of AutoSupport messages, NetApp strongly recommends using HTTPS as the default transport protocol for sending AutoSupport messages to NetApp support.
                    type: string
                driftAlert:
                    description: Indicates whether this alert was raised due to a configuration drift condition.
                    example: false
                    type: boolean
                duration:
                    description: Duration that this alert is active, in milliseconds.
                    example: "86400"
                    type: string
                hasRemediation:
                    description: Indicates whether this alert has an associated remediation workflow.
                    example: true
                    type: boolean
                impactArea:
                    description: |-
                        Broad classification category to which this alert belongs. Examples of categories are:
                        * AVAILABILITY
                        * CAPACITY
                        * CONFIGURATION
                        * PERFORMANCE
                        * PROTECTION
                        * SECURITY
                    enum:
                        - AVAILABILITY
                        - CAPACITY
                        - CONFIGURATION
                        - PERFORMANCE
                        - PROTECTION
                        - SECURITY
                    type: string
                lastTrueOccurrence:
                    description: The time that the condition described by this alert was last found to be true. This value is a timestamp in ISO 8601 format in UTC.
                    example: "2022-10-06T20:58:16.305Z"
                    format: date-time
                    type: string
                links:
                    $ref: '#/components/schemas/type_bxp_links'
                metadata:
                    $ref: '#/components/schemas/type_bxp_metadata'
                name:
                    description: Short name of the alert
                    example: AutoSupport HTTPS Transport Disabled
                    type: string
                origin:
                    description: |-
                        Specifies the entity that raised this alert. Defined values are:

                        * HARVEST

                        * AIQ

                        * CONNECTOR

                        * ONTAP_MANAGEMENT

                        * BACKUP_AND_RECOVERY
                    enum:
                        - HARVEST
                        - AIQ
                        - CONNECTOR
                        - ONTAP_MANAGEMENT
                        - BACKUP_AND_RECOVERY
                    example: HARVEST
                    type: string
                originId:
                    description: |-
                        Globally unique identifier of alert source that is reporting this
                        alert. This originId along with the alertId is used to uniquely
                        identify the alert resource.
                    example: 333a3f38-a4fa-4e32-a371-a37027748a32
                    type: string
                owner:
                    description: Action owner in the tenant organization
                    example: John.Doe@akme.com
                    type: string
                raisedOn:
                    description: The time that the alert was raised.
                    example: "2022-10-06T20:58:16.305Z"
                    format: date-time
                    type: string
                remediation:
                    description: |-
                        JSON object containing text that describes corrective actions about how to fix the issue
                        and an optional URL to navigate to the remedial workflow.
                    properties:
                        redirectURL:
                            description: URL that can be invoked to initiate the remediation.
                            example: https://www.xyz.com/
                            type: string
                        text:
                            example: 'To set HTTPS as the transport protocol for AutoSupport messages, run the following ONTAP command: system node autosupport modify -transport https'
                            type: string
                    type: object
                resourceId:
                    description: Identifier of the working environment/resource associated with this alert.
                    example: OnPremWorkingEnvironment-382602e4-6d35-4eaf-93cc-8b62b1b594c8
                    type: string
                severity:
                    description: |-
                        Severity of the condition associated with this alert. Defined values are:
                        * CRITICAL
                        * WARNING
                        * INFORMATIONAL
                    enum:
                        - CRITICAL
                        - WARNING
                        - INFORMATIONAL
                    type: string
                status:
                    description: |-
                        Status of the alert that shows whether the condition still exists. Defined values are:
                        * ACTIVE
                        * CLOSED
                    enum:
                        - ACTIVE
                        - CLOSED
                    type: string
                statusHistory:
                    description: JSON array of JSON objects representing the chronological order of how this alert has progressed in its life cycle.
                    items:
                        properties:
                            newStatus:
                                description: |-
                                    JSON string representing the old status of this alert. It can be:
                                    * CLOSED
                                enum:
                                    - CLOSED
                                type: string
                            oldStatus:
                                description: |-
                                    JSON string representing the old status of this alert. It can be:
                                    * ACTIVE
                                enum:
                                    - ACTIVE
                                type: string
                            timestamp:
                                description: Status change date
                                example: "2022-10-06T20:58:16.305Z"
                                format: date-time
                                type: string
                        type: object
                    type: array
                    uniqueItems: true
                storageClassId:
                    description: Identifier of the storage class associated with this alert.
                    example: 666a3f38-d4fa-5b62-a391-a69029758d32
                    type: string
                storageClassName:
                    description: Name of the storage class associated with this alert.
                    example: standard
                    type: string
                tag:
                    additionalProperties: true
                    description: Key-value pairs providing additional context about the alert, such as metric name, threshold value, and unit.
                    example:
                        metric_name: volume_size_used_percent
                        metric_threshold: "90"
                        metric_unit: '%'
                    type: object
            required:
                - alertId
                - originId
                - name
                - origin
                - alertObjectId
                - alertObjectType
                - associatedObjects
                - severity
                - status
                - owner
                - remediation
                - description
                - raisedOn
                - closedOn
                - duration
                - statusHistory
                - lastTrueOccurrence
                - impactArea
                - metadata
            type: object
        alert_1.0_list_response_body:
            properties:
                count:
                    description: Total number of resources in the collection that match the query.
