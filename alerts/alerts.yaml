info:
    description: The common Alerts service is available in NetApp Console as a centralized point to insert, query and manage alerts
    license:
        name: BlueXP License
    termsOfService: https://www.netapp.com/media/10784-cloud-data-services-terms.pdf
    title: (ncl) Alert API
    version: "1.0"
paths:
    /alerts/{alert_id}:
        get:
            description: Retrieve information about the specified alert.
            parameters:
                - description: Globally unique identifier of the alert source that is reporting this alert.
                  example: 333a3f38-a4fa-4e32-a371-a37027748a32
                  in: query
                  name: originId
                  required: true
                  schema:
                    type: string
                - description: Unique identifier of the organization to which the user belongs.
                  example: 3b44d359-d125-4665-b605-49d72c2dd7be
                  in: query
                  name: organizationId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/vnd.netapp.bxp.alert+json:
                            example:
                                alertDetails: AutoSupport HTTPS Transport Disabled
                                alertId: 666a3f38-d4fa-5b62-a391-a69029758d32
                                alertObjectId: 666a3f38-d4fa-5b62-a391-a69029758e56
                                alertObjectName: NB-001
                                alertObjectType: CLUSTER
                                associatedObjects:
                                    - objectId: 666a3f38-d4fa-5b62-a391-a69029758e56
                                      objectName: NB-001
                                      objectType: CLUSTER
                                closedOn: "2022-10-09T20:58:16.305662Z"
                                description: AutoSupport supports HTTPS, HTTP, and SMTP for transport protocols. Because of the sensitive nature of AutoSupport messages, NetApp strongly recommends using HTTPS as the default transport protocol for sending AutoSupport messages to NetApp support.
                                duration: "86500"
                                impactArea: SECURITY
                                lastTrueOccurrence: "2022-10-07T19:58:16.305662Z"
                                metadata:
                                    createdBy: 8f84cf09-8036-51e4-b579-bd30cb07b269
                                    creationTimestamp: "2022-10-05T20:58:16.305662Z"
                                    labels: []
                                    modificationTimestamp: "2022-10-09T20:58:16.305662Z"
                                    modifiedBy: 8f84cf09-8036-51e4-b579-bd30cb07b269
                                name: AutoSupport HTTPS Transport Disabled
                                origin: HARVEST
                                originId: 333a3f38-a4fa-4e32-a371-a37027748a32
                                owner: John.Doe@akme.com
                                raisedOn: "2022-10-05T20:58:16.305662Z"
                                remediation:
                                    redirectURL: https://www.xyz.com
                                    text: 'To set HTTPS as the transport protocol for AutoSupport messages, run the following ONTAP command: system node autosupport modify -transport https'
                                severity: CRITICAL
                                status: CLOSED
                                statusHistory:
                                    - newStatus: CLOSED
                                      oldStatus: ACTIVE
                                      timestamp: "2022-10-09T20:58:16.305662Z"
                                tag:
                                    metric_name: volume_size_used_percent
                                    metric_threshold: "90"
                                    metric_unit: '%'
                                type: application/vnd.netapp.bxp.alert
                                version: "1.0"
                            schema:
                                $ref: '#/components/schemas/alert_1.0_get_response_body'
                    description: Returns the stored Alert API resource in the JSON response body.
                "400":
                    $ref: '#/components/responses/400BadRequest'
                "401":
                    $ref: '#/components/responses/401Unauthorized'
                "403":
                    $ref: '#/components/responses/403Forbidden'
                "404":
                    $ref: '#/components/responses/404NotFound'
            summary: Retrieves a specific alert resource
            tags:
                - Alert
            x-permission: bxp:alert-read
            x-persistence: false
            x-scope: public,private,nco,ncl
        parameters:
            - description: |-
                Uniquely identifies the alert.

                Identifier generated by the client service to uniquely identify the alert. The Alert service
                doesn't assign any identifier to alert object.
              example: 666a3f38-d4fa-5b62-a391-a69029758d32
              in: path
              name: alert_id
              required: true
              schema:
                type: string
    /organizations/{organization_id}/alerts:
        get:
            description: Lists all alerts for the specified organization.
            parameters:
                - $ref: '#/components/parameters/filter'
                - $ref: '#/components/parameters/skip'
                - $ref: '#/components/parameters/include'
                - $ref: '#/components/parameters/limit'
                - $ref: '#/components/parameters/order_by'
                - $ref: '#/components/parameters/count'
                - $ref: '#/components/parameters/continue'
            responses:
                "200":
                    content:
                        application/vnd.netapp.bxp.alerts+json:
                            schema:
                                $ref: '#/components/schemas/alert_1.0_list_response_body'
                    description: List of all alerts for the organization
                "400":
                    $ref: '#/components/responses/400BadRequest'
                "401":
                    $ref: '#/components/responses/401Unauthorized'
                "403":
                    $ref: '#/components/responses/403Forbidden'
            summary: Lists all alerts for a specified organization
            tags:
                - Alert
            x-permission: bxp:alert-read
            x-persistence: false
            x-scope: public,private,ncl
        parameters:
            - $ref: '#/components/parameters/organization_id'
    /organizations/{organization_id}/alertsummary:
        get:
            description: Retrieves an alert count summary for the specified organization, grouped by impactArea and severity.
            responses:
                "200":
                    content:
                        application/vnd.netapp.bxp.alertsummary+json:
                            example:
                                criticalImpactArea:
                                    capacity: 1
                                    performance: 2
                                    protection: 2
                                    security: 1
                                impactArea:
                                    capacity: 1
                                    performance: 3
                                    protection: 5
                                    security: 1
                                severity:
                                    critical: 6
                                    error: 7
                                    informational: 15
                                    warning: 8
                            schema:
                                $ref: '#/components/schemas/alertsummary_1.0_get_response_body'
                    description: Summary of the alerts counts grouped by impactArea and severity.
                "400":
                    $ref: '#/components/responses/400BadRequest'
                "401":
                    $ref: '#/components/responses/401Unauthorized'
                "403":
                    $ref: '#/components/responses/403Forbidden'
