                    example: AQAB
                    type: string
                kid:
                    description: Unique identifier for the key, used to match a specific key in the JWKS with a key used in a cryptographic operation.
                    example: key-id-123
                    type: string
                kty:
                    description: Identifies the cryptographic algorithm family used with the key.
                    example: RSA
                    type: string
                "n":
                    description: Modulus value for an RSA public key, encoded in base64url.
                    example: 0vx7...4wE
                    type: string
                use:
                    description: Indicates the intended use of the public key.
                    example: sig
                    type: string
                x5c:
                    description: Contains a chain of one or more X.509 certificates, with the first certificate containing the public key corresponding to the key.
                    type: string
                x5t:
                    description: Base64url-encoded SHA-1 thumbprint (digest) of the DER encoding of the X.509 certificate.
                    example: abc123
                    type: string
            required:
                - kty
                - kid
                - use
                - alg
                - x5c
                - x5t
                - "n"
                - e
            type: object
