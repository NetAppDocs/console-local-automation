    /v1/organizations/{organizationId}/fleets/{fleetId}/workingenvironments:
        post:
            description: |
                Discovers and registers a storage device as a system in the specified organization and fleet.
                Use stateDesired to control the behavior:
                - VALIDATED: Only validates the storage device without registration. Returns 204 with no content.
                - REGISTERED: Validates and registers the storage device. Returns 201 with system details.
            parameters:
                - description: Organization ID
                  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  in: path
                  name: organizationId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: Fleet ID
                  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  in: path
                  name: fleetId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        examples:
                            registerStorageDevice (ONTAP):
                                summary: Register a new ONTAP storage device
                                value:
                                    ip: 10.193.96.173
                                    password: password123
                                    stateDesired: REGISTERED
                                    type: ON_PREM
                                    username: admin
                            validateStorageDevice (ONTAP):
                                summary: Validate ONTAP storage device only (no registration)
                                value:
                                    ip: 10.193.96.173
                                    password: password123
                                    stateDesired: VALIDATED
                                    type: ON_PREM
                                    username: admin
                        schema:
                            $ref: '#/components/schemas/workingenvironment_1.0_post_request_body'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            example:
                                aff: false
                                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                                name: onprem-cluster-01
                                type: ON_PREM
                                workingEnvironmentId: OnPremWorkingEnvironment-3fa85f64-5717-4562-b3fc-2c963f66afa6
                            schema:
                                $ref: '#/components/schemas/workingenvironment_1.0_post_response_body'
                    description: System discovered and registered successfully (when stateDesired is REGISTERED).
                "204":
                    description: Cluster validated successfully. No content returned (when stateDesired is VALIDATED).
                "400":
                    content:
                        application/vnd.netapp.bxp.problem+json:
                            examples:
                                connectionTimeout:
                                    summary: Connection timeout
                                    value:
                                        detail: Timeout reached while trying to connect to cluster at 10.10.10.100
                                        status: "400"
                                        title: Connection Timeout
                                        type: https://bluexp.netapp.io/problems/400
                                createCredentials:
                                    summary: Failed to create credentials
                                    value:
                                        detail: Failed to create credentials for system
                                        status: "400"
                                        title: Create Credentials Failed
                                        type: https://bluexp.netapp.io/problems/400
                                duplicateSerialNumber:
                                    summary: Duplicate serial number
                                    value:
                                        detail: System with serial number 1-80-000011 already discovered in tenant workspace-abc123
                                        status: "400"
                                        title: Duplicate Serial Number
                                        type: https://bluexp.netapp.io/problems/400
                                unsupportedVersion:
                                    summary: Unsupported ONTAP version
                                    value:
                                        detail: 'ONTAP version must be 8.2.1 or higher. Current version: 8.1.0'
                                        status: "400"
                                        title: Unsupported ONTAP Version
                                        type: https://bluexp.netapp.io/problems/400
                                validateCredentials:
                                    summary: Failed to validate credentials
                                    value:
                                        detail: Failed to validate credentials for ONTAP cluster. Authentication failed with provided username and password.
                                        status: "400"
                                        title: Credential Validation Failed
                                        type: https://bluexp.netapp.io/problems/400
                                wrongIPType:
                                    summary: Wrong IP address type
                                    value:
                                        detail: The provided IP address is a cluster management IP, not an SVM management IP
                                        status: "400"
                                        title: Invalid IP Type
                                        type: https://bluexp.netapp.io/problems/400
                    description: Bad Request
                "401":
                    content:
                        application/vnd.netapp.bxp.problem+json:
                            example:
                                detail: Invalid or missing bearer token
                                status: "401"
                                title: Unauthorized
                                type: https://bluexp.netapp.io/problems/401
                    description: Unauthorized Access
                "403":
                    content:
                        application/vnd.netapp.bxp.problem+json:
                            example:
                                detail: Request forbidden. Insufficient permissions.
                                status: "403"
                                title: Forbidden
                                type: https://bluexp.netapp.io/problems/403
                    description: Forbidden Request
            summary: Discover System
            tags:
                - System Discovery
            x-scope: private,public,ncl
