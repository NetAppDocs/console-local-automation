                    format: double
                    type: number
                unit:
                    description: Unit
                    type: string
            required:
                - size
                - unit
            type: object
        volume_1.0_post_request_body:
            properties:
                aggregateName:
                    description: Aggregate in which to create the volume
                    type: string
                enableCompression:
                    description: Enable compression on the volume
                    type: boolean
                enableDeduplication:
                    description: Enable deduplication on the volume
                    type: boolean
                enableThinProvisioning:
                    description: Enable thin provisioning on the volume
                    type: boolean
                exportPolicyInfo:
                    $ref: '#/components/schemas/volume_1.0_export_policy_info'
                flexGroupVolumeInfo:
                    $ref: '#/components/schemas/volume_1.0_flex_group_volume_info'
                initialSize:
                    $ref: '#/components/schemas/volume_1.0_capacity'
                iscsiInfo:
                    $ref: '#/components/schemas/volume_1.0_create_iscsi_info_request'
                name:
                    description: Volume name, unique within the SVM
                    type: string
                shareInfo:
                    $ref: '#/components/schemas/volume_1.0_create_cifs_share_info_request'
                size:
                    $ref: '#/components/schemas/volume_1.0_positive_capacity'
                snapshotPolicyName:
                    description: Snapshot policy name
                    type: string
                svmName:
                    description: SVM name
                    type: string
                syncToS3:
                    description: Add a cloud sync relationship
                    type: boolean
                volumeTags:
                    description: Optionally, provide key-value pairs with which to tag the ONTAP volume using the App Template service.
                    items:
                        $ref: '#/components/schemas/volume_1.0_volume_tags'
                    properties:
                        empty:
                            type: boolean
                        traversableAgain:
                            type: boolean
                    type: array
                workingEnvironmentId:
                    description: Target system ID
                    type: string
            type: object
        volume_1.0_volume_tags:
            properties:
                tagKey:
                    type: string
                tagValue:
                    type: string
            type: object
        volumes_1.0_cifs_shares:
            description: CIFS share details.
            properties:
                name:
                    description: Name of the CIFS share.
                    example: my_cifs_share
                    type: string
                permission:
                    description: Permissions for the CIFS share.
                    enum:
                        - NO_ACCESS
                        - READ
                        - CHANGE
                        - FULL_CONTROL
                    example: FULL_CONTROL
                    type: string
                usersOrGroups:
                    description: List of users or groups with access to the CIFS share.
                    example:
                        - user1
                        - user2
                    items:
                        type: string
                    type: array
            type: object
        volumes_1.0_export_policy:
            description: Export policy details
            properties:
                hosts:
                    description: List of hosts associated with the export policy.
                    example:
                        - host1
                        - host2
                    items:
                        type: string
                    type: array
                name:
                    description: Name of the export policy. To associate an existing policy, name is mandatory. For new policy creation it is optional, if not provided it will default to the volume name.
                    example: my_export_policy
                    type: string
            type: object
        volumes_1.0_list_response_body:
            properties:
                count:
                    description: Total number of volumes in the collection that match the query.
                    example: 37
                    format: int
