                    type: array
                cifsShares:
                    $ref: '#/components/schemas/volumes_1.0_cifs_shares'
                exportPolicy:
                    $ref: '#/components/schemas/volumes_1.0_export_policy'
                name:
                    description: Name of the volume to be provisioned.
                    example: my_volume
                    type: string
                size:
                    description: Size of the volume, in bytes.
                    example: 107374182400
                    format: int64
                    type: integer
                storageClassId:
                    description: Storage class identifier.
                    example: 888c5g50-f6gc-7d84-c5b3-c89241970f54
                    format: uuid
                    type: string
                svmId:
                    description: Storage Virtual Machine identifier.
                    example: 777b4f49-e5fb-6c73-b4a2-b79130869e43
                    format: uuid
                    type: string
                type:
                    description: |-
                        Media type of the resource.
                        Defined values are:
                        * "application/vnd.netapp.bxp.volume"
                    enum:
                        - application/vnd.netapp.bxp.volume
                    example: application/vnd.netapp.bxp.volume
                    type: string
                version:
                    description: |-
                        Version of the resource schema.
                        Defined values are:
                        * "1.0"
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            required:
                - name
                - size
                - svmId
                - type
                - version
            type: object
        volumes_1.0_post_response_body:
            description: Job creation response
            properties:
                jobId:
                    description: Unique identifier for the created job.
                    example: 555e2d27-c3a4-4b1e-8f5b-123456789abc
                    format: uuid
                    type: string
            required:
                - jobId
            type: object
        workingenvironment_1.0_get_response_body:
            properties:
                capacityDistribution:
                    properties:
                        available:
                            description: Aggregated available capacity, in bytes.
                            example: 28919
                            type: integer
                        physicalUsed:
                            description: Aggregated physical used capacity, in bytes.
                            example: 28919
                            type: integer
                        size:
                            description: Aggregated size capacity, in bytes.
                            example: 290
                            type: integer
                        used:
                            description: Aggregated used capacity, in bytes.
                            example: 809
                            type: integer
                    type: object
                nodes:
                    items:
                        properties:
                            name:
                                example: sti240-vsim-osr001m
                                type: string
                            serialNumber:
                                example: 4094014-41-4
                                type: string
                            systemId:
                                example: "4094014414"
                                type: string
                            uuid:
                                example: 7f48d2f6-ab68-11f0-9c61-005056bd752a
                                format: uuid
                                type: string
                        type: object
                    type: array
                ontapVersion:
                    example: skilletdonut_9.61.1
                    type: string
                storageEfficiency:
                    properties:
                        efficiencyRatio:
                            example: 1.65:1
                            type: string
                        efficiencyWithoutSnapshotRatio:
                            example: 1.19:1
                            type: string
                    type: object
                systemInformation:
                    properties:
                        managementIP:
                            example: 10.196.22.114
                            type: string
                        name:
                            example: onprem-ontap-01
                            type: string
                        replicationLicenses:
                            example:
                                - snapmirror
                                - snapvault
                            items:
                                type: string
                            type: array
                        resourceType:
                            enum:
                                - On-Prem ONTAP
