                            type: boolean
                    type: array
                numberOfConstituents:
                    description: Number of constituents for the flexgroup volume
                    format: int32
                    type: integer
            type: object
        volume_1.0_get_response_body:
            properties:
                name:
                    description: Volume name
                    example: trident_pvc_f4a7ae4e_476d_4fc9_aab3_4092c6d5533e
                    type: string
                protection:
                    description: Protection status for the volume.
                    properties:
                        backupToCloud:
