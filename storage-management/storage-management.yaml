            type: object
        workingenvironment_1.0_list_response_body:
            properties:
                count:
                    description: Total number of systems returned.
                    example: 2
                    minimum: 0
                    type: integer
                items:
                    description: A list of systems.
                    items:
                        properties:
                            agentId:
                                description: Agent identifier associated with the system.
                                example: agent-12345678
                                type: string
                            certificateId:
                                description: Certificate ID for storage device connection.
                                example: 123e4567-e89b-12d3-a456-426614174000
                                type: string
                            clusterUuid:
                                description: UUID of the ONTAP cluster.
                                example: 123e4567-e89b-12d3-a456-426614174000
                                type: string
                            credentialId:
                                description: Credential ID for storage device access.
                                example: credential-abc123
                                type: string
                            id:
                                description: Unique identifier for the storage device.
                                example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                                type: string
                            ip:
                                description: Management IP or address of the storage device.
                                example: 10.10.10.100
                                type: string
                            metadata:
                                additionalProperties: true
                                description: Metadata associated with the system.
                                type: object
                            name:
                                description: Name of the system
                                example: Production Cluster 1
                                type: string
                            ontapVersion:
                                description: ONTAP cluster version
                                example: 9.14.1
                                type: string
                            organizationId:
                                description: Organization ID associated with the system.
                                example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                                format: uuid
                                type: string
                            serial:
                                description: Serial number of the storage device.
                                example: 1-80-000011
                                type: string
                            type:
                                description: Type of the storage device.
                                enum:
                                    - ON_PREM
                                    - SG
                                    - ESERIES
                                example: ON_PREM
                                type: string
                            version:
                                description: Version of the storage device.
                                example: 9.14.1
                                type: string
                            workingEnvironmentId:
                                description: Unique identifier for the discovered system.
                                type: string
                        required:
                            - workingEnvironmentId
                            - ip
                            - type
                            - agentId
                            - credentialId
                            - name
                            - serial
                            - version
                            - id
                        type: object
                    type: array
            required:
                - count
                - items
            type: object
        workingenvironment_1.0_list_response_body_summary:
            properties:
                count:
                    description: Total number of systems returned.
                    example: 2
                    minimum: 0
                    type: integer
                items:
                    description: List of systems.
                    items:
                        properties:
                            agentId:
                                description: Agent identifier associated with the system.
                                example: agent-12345678
                                type: string
                            credentialId:
                                description: Credential ID for storage device access.
                                example: credential-abc123
                                type: string
                            id:
                                description: Unique identifier for the storage device.
                                example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                                type: string
                            ip:
                                description: Management IP or address of the storage device.
                                example: 10.10.10.100
                                type: string
                            metadata:
                                additionalProperties: true
                                description: Metadata associated with the system.
                                type: object
                            name:
                                description: Name of the system
                                example: Production Cluster 1
                                type: string
                            organizationId:
                                description: Organization ID associated with the system.
                                example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                                format: uuid
                                type: string
                            type:
                                description: Type of the storage device.
                                enum:
                                    - ON_PREM
                                example: ON_PREM
                                type: string
                            version:
                                description: Version of the storage device.
                                example: 9.14.1
                                type: string
                            workingEnvironmentId:
                                description: Unique identifier for the discovered system.
                                type: string
                        required:
                            - workingEnvironmentId
                            - ip
                            - type
                            - agentId
                            - credentialId
                            - name
                            - version
                            - id
                        type: object
                    type: array
            required:
                - count
                - items
            type: object
        workingenvironment_1.0_patch_request_body:
            description: |
                Fields to update for the system. Only include the fields you want to modify.
                Any fields present in the request body will be updated; fields not included will remain unchanged.
            properties:
                password:
                    description: ONTAP cluster password
                    example: NetApp123!
                    format: password
                    type: string
                username:
                    description: ONTAP cluster username
                    example: admin
                    type: string
            type: object
        workingenvironment_1.0_post_request_body:
            properties:
                fleetId:
                    description: Optional Fleet ID to associate with the discovered storage device.
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    format: uuid
                    type: string
                ip:
                    description: Storage device IP from user input.
                    example: 10.193.96.173
                    type: string
                password:
                    description: Storage device password.
                    example: password123
                    format: password
                    type: string
                stateDesired:
                    description: Desired state for the system. VALIDATED only validates the storage device without registering. REGISTERED validates and registers the storage device.
                    enum:
                        - VALIDATED
                        - REGISTERED
                    example: REGISTERED
                    type: string
                type:
                    default: ON_PREM
                    description: Type of the system.
                    enum:
                        - ON_PREM
                    example: ON_PREM
                    type: string
                username:
                    description: Storage device username.
                    example: admin
                    type: string
            required:
                - ip
                - username
                - password
                - stateDesired
            type: object
        workingenvironment_1.0_post_response_body:
            properties:
                aff:
                    description: Indicates whether the system is AFF (All Flash FAS).
                    example: false
                    type: boolean
                id:
                    description: Unique identifier for the system.
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    format: uuid
                    type: string
                name:
                    description: Name of the system.
                    example: onprem-cluster-01
                    type: string
                type:
                    description: Location type of the cluster.
                    enum:
                        - ON_PREM
                    example: ON_PREM
                    type: string
                workingEnvironmentId:
                    description: Unique identifier for the discovered system, which might differ from the internal ID used by the system. This is the ID that will be used in API calls to reference this system.
                    example: OnPremWorkingEnvironment-3fa85f64-5717-4562-b3fc-2c963f66afa6
                    type: string
            required:
                - workingEnvironmentId
                - name
                - type
                - aff
            type: object
        workingenvironment_certificate_1.0_get_response_body:
            properties:
                certificate:
                    description: The string containing the base 64 encoded certificate.
                    example: |-
                        -----BEGIN CERTIFICATE-----
                        MIIDnzCCAwegAwIBAgIJAJ7
                    type: string
                certificateType:
                    description: The type of the certificate. It can be SELF_SIGNED or CA_SIGNED.
                    enum:
                        - SELF_SIGNED
                        - CA_SIGNED
                    example: CA_SIGNED
                    type: string
                commonName:
                    description: The common name of the certificate.
                    example: example.com
                    type: string
                expiryDate:
                    description: The date and time the certificate expires.
                    example: "2022-01-01T00:00:00Z"
                    format: date-time
                    type: string
                host:
                    description: Host name or IP address of the device.
                    example: 10.11.12.13
                    type: string
                id:
                    description: The unique identifier for the certificate.
                    example: 123e4567-e89b-12d3-a456-426614174000
                    format: uuid
                    type: string
                invalidReason:
                    $ref: '#/components/schemas/type_bxp_invalid_reason'
                issuedON:
                    description: The date and time when the certificate is issued.
                    example: "2020-01-01T00:00:00Z"
                    format: date-time
                    type: string
                issuerDN:
                    description: Unique name of the Certificate Authority that issued and signed the certificate.
                    example: CN=Example CA, O=Example Certificate Authority, OU=Certification Services, L=San Francisco, ST=California, C=US
                    type: string
                serialNumber:
                    description: Unique identifier assigned to the certificate.
                    example: 05:D0:E6:62:91:FD:4X
                    type: string
                sha1Fingerprint:
                    description: The SHA1 fingerprint of the certificate.
                    example: 05:D0:E6:62:91:FD:4X
                    type: string
                sha256Fingerprint:
                    description: The SHA256 fingerprint of the certificate.
                    example: 05:D0:E6:62:91:FD:4X
                    type: string
                state:
                    description: The state of the certificate. It can be VALID, INVALID or EXPIRED. If the defined checks are passed, the state will be set to VALID. If the defined checks are not passed, the state will be set to INVALID. If the certificate is expired, the state will be set to EXPIRED.
                    enum:
                        - VALID
                        - INVALID
                        - EXPIRED
                    example: VALID
                    type: string
                subjectDN:
                    description: Unique name that identifies the entity associated with the public key stored in the certificate.
                    example: CN=www.example.com, O=Example Corporation, OU=IT Department, L=Mountain View, ST=California, C=US
                    type: string
                type:
                    description: |-
                        Media type of the resource.
                        Defined values are:
                        * "application/vnd.netapp.bxp.certificate"
                    enum:
                        - application/vnd.netapp.bxp.certificate
                    example: application/vnd.netapp.bxp.certificate
                    type: string
                version:
                    description: |-
                        Version of the resource.
                        Defined values are:
                        * "1.0"
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            required:
                - id
                - certificate
                - commonName
                - issuedON
                - expiryDate
                - state
                - certificateType
                - host
                - serialNumber
                - subjectDN
                - issuerDN
                - sha1Fingerprint
                - sha256Fingerprint
                - type
                - version
            type: object
info:
    title: Storage Management API
    description: |-
        The NetApp Console storage management API enables you to discover and manage ONTAP storage systems through the Console agent.

        The storage management endpoints allow you to register systems, manage storage resources, and configure storage policies
        for your ONTAP clusters managed through the NetApp Console.

        The following components are defined within storage management:
        <ul>
        <li>storage classes and policies</li>
        <li>storage management</li>
        <li>system discovery</li>
        </ul>

        **Note**: Before using the API reference documentation, review the
        [Get started](https://docs.netapp.com/us-en/console-local-automation/platform/learn-about.html) section for the Console local deployment APIs.

        ## Query parameters

        You can use query parameters with endpoints in the following resources:

        | Resource           | Query Parameter                                    |
        |--------------------|----------------------------------------------------|
        | storage classes and policies         | count, filter, include, limit, orderBy, skip |
        | storage management            | Not applicable |
        | system discovery            | Not applicable                  |
        
       
    termsOfService: https://www.netapp.com/media/10784-cloud-data-services-terms.pdf
    license:
        name: NetApp Console License
    version: '1.0'
paths:
    /v1/organizations/{organizationId}/capacitypolicies:
        get:
            description: Lists all capacity policies in the specified organization.
            parameters:
                - $ref: '#/components/parameters/filter'
                - $ref: '#/components/parameters/skip'
                - $ref: '#/components/parameters/include'
                - $ref: '#/components/parameters/limit'
                - $ref: '#/components/parameters/order_by'
                - $ref: '#/components/parameters/count'
            responses:
                "200":
                    content:
                        application/vnd.netapp.bxp.capacitypolicy+json:
                            example:
                                count: 1
                                items:
                                    - autoGrow: GROW
                                      description: Policy for production workloads with auto-grow and tiering
                                      id: 123e4567-e89b-12d3-a456-426614174000
                                      metadata:
                                        createdBy: 666a3f38-d4fa-5b62-a391-a69029758d32
                                        creationTimestamp: "2024-01-15T10:30:00.000Z"
                                        labels: []
                                        modificationTimestamp: "2024-01-20T14:45:00.000Z"
                                        modifiedBy: 666a3f38-d4fa-5b62-a391-a69029758d32
                                      name: Production Capacity Policy
                                      organizationId: 666a3f38-d4fa-5b62-a391-a69029758d32
                                      policyType: USER_DEFINED
                                      spaceReserved: THIN
                                      tags:
                                        - internal:bxp:metric:associatedWorkloadCnt: "2"
                                      tiering: AUTO
                                      type: application/vnd.netapp.bxp.capacitypolicy
                                      version: "1.0"
                                      volumeType: FLEXVOL
                            schema:
                                $ref: '#/components/schemas/capacity_policy_1.0_list_response_body'
                    description: Successfully retrieved capacity policies list
                "400":
                    $ref: '#/components/responses/400BadRequest'
                "401":
                    $ref: '#/components/responses/401Unauthorized'
                "403":
                    $ref: '#/components/responses/403Forbidden'
                "404":
                    $ref: '#/components/responses/404NotFound'
            summary: List all capacity policies in an organization
            tags:
                - Storage Classes and Policies
            x-permission: bxp:policy-read
            x-persistence: true
            x-scope: private,public,ncl
        parameters:
            - description: Organization ID
              example: 666a3f38-d4fa-5b62-a391-a69029758d32
              in: path
              name: organizationId
              required: true
              schema:
                format: uuid
                type: string
        post:
            description: Creates a new capacity policy.
            requestBody:
                content:
                    application/vnd.netapp.bxp.capacitypolicy+json:
                        examples:
                            createCapacityPolicyAllFields:
                                summary: Create capacity policy request with all fields
                                value:
                                    autoGrow: GROW
                                    description: Policy for production workloads with auto-grow and tiering enabled
                                    name: Production Capacity Policy
                                    spaceReserved: THIN
                                    tags:
                                        - internal:bxp:metric:associatedWorkloadCnt: "2"
                                    tiering: AUTO
                                    type: application/vnd.netapp.bxp.capacitypolicy
                                    version: "1.0"
                                    volumeType: FLEXVOL
                            createCapacityPolicyMandatoryFields:
                                summary: Create capacity policy request with mandatory fields
                                value:
                                    name: Production Capacity Policy
                                    type: application/vnd.netapp.bxp.capacitypolicy
                                    version: "1.0"
                        schema:
                            $ref: '#/components/schemas/capacity_policy_1.0_post_request_body'
                description: Capacity policy properties for creation
                required: true
            responses:
                "201":
                    content:
                        application/vnd.netapp.bxp.capacitypolicy+json:
                            example:
                                autoGrow: GROW
                                description: Policy for production workloads with auto-grow and tiering
                                id: 123e4567-e89b-12d3-a456-426614174000
                                metadata:
                                    createdBy: 666a3f38-d4fa-5b62-a391-a69029758d32
                                    creationTimestamp: "2024-01-15T10:30:00.000Z"
                                    labels: []
                                    modificationTimestamp: "2024-01-20T14:45:00.000Z"
