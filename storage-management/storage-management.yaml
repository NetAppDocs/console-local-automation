                            example: false
                            type: boolean
                        snapmirror:
                            description: Indicates if SnapMirror replication is enabled.
                            example: true
                            type: boolean
                        snapshot:
                            description: Indicates if snapshot protection is enabled.
                            example: true
                            type: boolean
                    required:
                        - snapshot
                        - snapmirror
                        - backupToCloud
                    type: object
                provisioned:
                    description: Provisioned volume capacity, in bytes.
                    example: 107374182400
                    type: integer
                state:
                    description: Volume state
                    enum:
                        - mixed
                        - online
                        - offline
                        - error
                        - restricted
                    example: online
                    type: string
                storageVMName:
                    description: Storage VM name
                    example: vs0
                    type: string
                style:
                    description: Volume style
                    enum:
                        - FlexVol
                        - FlexGroup
                    example: FlexVol
                    type: string
                tieredData:
                    description: Tiered data capacity, in bytes.
                    example: 10737418240
                    type: integer
                usedAndReserved:
                    description: Used and reserved volume capacity, in bytes.
                    example: 53687091200
                    type: integer
                uuid:
                    description: Unique identifier for the volume.
                    example: f4a7ae4e-476d-4fc9-aab3-4092c6d5533e
                    type: string
            required:
                - name
                - uuid
                - state
                - storageVMName
                - provisioned
                - usedAndReserved
                - tieredData
                - style
                - protection
            type: object
        volume_1.0_igroup_creation_request:
            properties:
                igroupName:
                    description: Igroup name
                    type: string
                initiators:
                    description: Initiators
                    items:
                        type: string
                    properties:
                        empty:
                            type: boolean
                        traversableAgain:
                            type: boolean
                    type: array
            type: object
        volume_1.0_positive_capacity:
            properties:
                size:
