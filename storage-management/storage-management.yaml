        volumes_1.0_post_request_body:
            description: Storage provisioning request payload.
            properties:
                aggregates:
                    description: List of aggregate identifiers where the volume can be created.
                    example:
                        - 999d6h61-g7hd-8e95-d6c4-d99352081g65
                        - aaa17i72-h8ie-9f06-e7d5-ea145392h76
                    items:
                        format: uuid
