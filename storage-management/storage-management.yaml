security:
    - bxp_bearer_auth: []
servers:
    - url: '{{.Server}}'
tags:
    - name: System Discovery
      description: |-
        The system discovery endpoints enable you to register and manage ONTAP storage systems through the Console agent.

        You can perform the following actions using the system discovery endpoints:
        <ul>
        <li>Discover a system</li>
        <li>Update a system</li>
        <li>Delete a system</li>
        </ul>
    - name: Storage Management
      description: |-
        The storage management endpoints enable you to manage ONTAP cluster resources such as volumes and LUNs
        on systems managed through the Console agent.

        You can perform the following actions using the storage management endpoints:
        <ul>
        <li>Create a new volume</li>
        <li>Create a new LUN</li>
        <li>Get system recommendations for storage placement</li>
        </ul>
    - name: Storage Classes and Policies
      description: |-
        The storage classes and policies endpoints enable you to create and manage capacity policies, performance policies,
        protection policies, and security policies for ONTAP storage systems.

        You can perform the following actions using the storage classes and policies endpoints:
        <ul>
        <li>List and retrieve capacity policies</li>
        <li>Create, update, and delete capacity policies</li>
        <li>List and retrieve performance policies</li>
        <li>Create, update, and delete performance policies</li>
        <li>List and retrieve protection policies</li>
        <li>Create, update, and delete protection policies</li>
        <li>List and retrieve security policies</li>
        <li>Create, update, and delete security policies</li>
        <li>List and retrieve storage classes</li>
        </ul>