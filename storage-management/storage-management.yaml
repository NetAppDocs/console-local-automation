                config:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    description: |-
                        Configuration properties for the component. Each property is an array of strings.
                        Common LDAP properties include:
                        * vendor - LDAP vendor (ad, rhds, tivoli, etc.)
                        * connectionUrl - LDAP connection URL
                        * bindDn - Bind DN for authentication
                        * bindCredential - Bind password
                        * usersDn - Base DN for user searches
                        * usernameLDAPAttribute - LDAP attribute for username
                        * rdnLDAPAttribute - RDN LDAP attribute
                        * uuidLDAPAttribute - UUID LDAP attribute
                        * userObjectClasses - User object classes
                        * editMode - Edit mode (READ_ONLY, WRITABLE, UNSYNCED)
                        * importEnabled - Whether to import users
                        * syncRegistrations - Whether to sync registrations
                    example:
                        bindCredential:
                            - password
                        bindDn:
                            - cn=admin,dc=example,dc=com
                        connectionUrl:
                            - ldap://ldap.example.com:389
                        editMode:
                            - READ_ONLY
                        importEnabled:
                            - "true"
                        rdnLDAPAttribute:
                            - cn
                        syncRegistrations:
                            - "false"
                        userObjectClasses:
                            - person, organizationalPerson, user
                        usernameLDAPAttribute:
                            - sAMAccountName
                        usersDn:
                            - ou=users,dc=example,dc=com
                        uuidLDAPAttribute:
                            - objectGUID
                        vendor:
