        systemrecommendations_1.0_post_request_body:
            description: Storage placement recommendation request.
            properties:
                capacityPolicyId:
                    description: Optional capacity policy identifier for the recommendation.
                    example: 888c5g50-f6gc-7d84-c5b3-c89241970f53
                    format: uuid
                    type: string
                fleetId:
                    description: Fleet identifier for the recommendation.
                    example: 666a3f38-d4fa-5b62-a391-a69029758d31
                    format: uuid
                    type: string
                performancePolicyId:
                    description: Optional performance policy identifier for the recommendation.
                    example: 888c5g50-f6gc-7d84-c5b3-c89241970f51
                    format: uuid
                    type: string
                securityPolicyId:
                    description: Optional security policy identifier for the recommendation.
                    example: 888c5g50-f6gc-7d84-c5b3-c89241970f52
                    format: uuid
                    type: string
                size:
                    description: Size of the storage, in bytes.
                    example: 107374182400
                    format: int64
                    type: integer
                storageClassId:
                    description: Optional storage class identifier for the recommendation.
                    example: 888c5g50-f6gc-7d84-c5b3-c89241970f54
                    format: uuid
                    type: string
                storageCount:
                    description: Number of storage units requested, used to specify LUN count.
                    example: 2
                    type: integer
                storageType:
                    description: Type of storage requested.
                    enum:
                        - VOLUME
                        - LUN
                    example: LUN
                    type: string
                type:
                    description: |-
                        Media type of the resource.
                        Defined values are:
                        * "application/vnd.netapp.bxp.systemrecommendations"
                    enum:
                        - application/vnd.netapp.bxp.systemrecommendations
                    example: application/vnd.netapp.bxp.systemrecommendations
                    type: string
                version:
                    description: |-
                        Version of the resource schema.
                        Defined values are:
                        * "1.0"
                    enum:
                        - "1.0"
                    example: "1.0"
                    type: string
            required:
                - storageType
                - size
                - type
                - version
            type: object
        systemrecommendations_1.0_post_response_body:
            description: Storage placement recommendation response.
            properties:
                count:
                    description: Number of recommendations provided
                    example: 2
                    type: integer
                items:
                    description: List of placement recommendations.
                    example:
                        - availableCapacity: 549755813888
                          fleets:
                            - id: 666a3f38-d4fa-5b62-a391-a69029758d31
                              name: fleet-name-1
                          name: cluster-name-1
                          ontapVersion: 9.16.1
                          personality: UNIFIED_ONTAP
                          recommendation: STRICT
                          svms:
                            - aggregates:
                                - id: aaa17i72-h8ie-9f06-e7d5-ea145392h76
                                  name: aggr1
                                  recommendation: STRICT
                                - id: bbb28j83-i9jk-0l17-f8g6-faa65243h81
                                  name: dataAggr2
                                  recommendation: RELAXED
                              enabledProtocols:
                                - NFS
                                - CIFS
                              id: 777b4f49-e5fb-6c73-b4a2-b79130869e43
                              name: svm1
                              recommendation: STRICT
                            - aggregates:
                                - id: bbb28j83-i9jk-0l17-f8g6-faa65243h81
                                  name: dataAggr2
                                  recommendation: RELAXED
                              enabledProtocols:
                                - iSCSI
                              id: 888c5g50-f6gc-7d84-c5b3-c89241970f54
                              name: svm2
                              recommendation: RELAXED
                          totalCapacity: 1099511627776
                          usedCapacity: 536870912000
                          workingEnvironmentId: OnPremWorkingEnvironment-RRpEXDdH
                        - availableCapacity: 1099511627776
                          fleets:
                            - id: 999d6h61-g7hd-8e95-d6c4-d99352081g65
                              name: fleet-name-2
                          name: cluster-name-2
                          ontapVersion: 9.12.1
                          personality: ASA_R2
                          recommendation: RELAXED
                          svms:
                            - aggregates:
                                - id: bbb28j83-i9jk-0l17-f8g6-faa65243h81
                                  name: dataAggr2
                                  recommendation: RELAXED
                              enabledProtocols:
                                - NFS
                              id: aaa17i72-h8ie-9f06-e7d5-ea145392h76
                              name: svm3
                              recommendation: RELAXED
                          totalCapacity: 2199023255552
                          usedCapacity: 536870911900
                          workingEnvironmentId: OnPremWorkingEnvironment-XYZ789
                    items:
                        properties:
                            availableCapacity:
                                description: Available capacity of the system, in bytes.
                                example: 549755813888
                                format: int64
                                type: integer
                            name:
                                description: Recommended cluster name.
                                example: cluster-name-1
                                type: string
                            ontapVersion:
                                description: ONTAP version of the system.
                                example: 9.16.1
                                type: string
                            personality:
                                description: |-
                                    The personality of the ONTAP cluster.
                                    Defined values are:
                                    * "UNIFIED_ONTAP" - A traditional unified ONTAP cluster (not disaggregated).
                                    * "ASA_R2" - A disaggregated, SAN-optimized All-Flash SAN Array (ASA) r2 cluster.
                                    * "AFX" - A disaggregated cluster that is not SAN-optimized.
                                enum:
                                    - UNIFIED_ONTAP
                                    - ASA_R2
                                    - AFX
                                example: UNIFIED_ONTAP
                                type: string
                            recommendation:
                                description: |-
                                    Indicates whether the performance policy is followed or relaxed while recommending this cluster.
                                    If any SVM under this cluster is recommended with a strict policy, the cluster recommendation will also be strict.
                                    Defined values are:
                                    * "STRICT" - performance policy criteria is strictly followed while recommending this cluster.
                                    * "RELAXED" - performance policy criteria is relaxed while recommending this cluster.
                                enum:
                                    - STRICT
                                    - RELAXED
                                example: STRICT
                                type: string
                            svms:
                                description: List of Storage Virtual Machines in the system.
                                items:
                                    properties:
                                        aggregates:
                                            description: List of aggregates in the SVM.
                                            items:
                                                properties:
                                                    id:
                                                        description: Aggregate identifier
                                                        example: aaa17i72-h8ie-9f06-e7d5-ea145392h76
                                                        format: uuid
                                                        type: string
                                                    name:
                                                        description: Aggregate name
                                                        example: aggr1
                                                        type: string
                                                    recommendation:
                                                        description: |-
                                                            Indicates whether the performance policy is followed or relaxed while recommending this aggregate.
                                                            Defined values are:
                                                            * "STRICT" - performance policy criteria is strictly followed while recommending this aggregate.
                                                            * "RELAXED" - performance policy criteria is relaxed while recommending this aggregate.
                                                        enum:
                                                            - STRICT
                                                            - RELAXED
                                                        example: STRICT
