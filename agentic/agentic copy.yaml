    /supportedModels:
        get:
            description: |-
                Returns a list of all available Large Language Model (LLM) models that can be used with the Agentic Platform.

                Supports filtering by provider, modelType, and other fields.
                Supports pagination using skip and limit parameters.
            parameters:
                - description: |-
                    Specifies which fields should be matched in order to return a resource when listing supported models.


                    Supported operators:
                    * eq - Equality
                    * ne - Not equal
                    * lt/gt - Less than or greater than
                    * lte/gte - Less than or equal to or greater than or equal to
                    * in - Membership in a list


                    Expressions can be chained with `and` or `or` to build complex filters.
                    Parentheses can be used for grouping and precedence control.


                    Filterable fields: provider, modelType, name, contextWindow, maxOutputTokens, and isEnabled


                    URL example: "filter=provider%20eq%20%27openai%27"

                    URL example: "filter=modelType%20eq%20%27chat%27%20and%20provider%20eq%20%27anthropic%27"

                    URL example: "filter=contextWindow%20gte%20128000"

                    OpenAPI examples: "provider eq 'openai'", "modelType eq 'chat' and provider eq 'anthropic'"
                  in: query
                  name: filter
                  schema:
                    type: string
                - $ref: '#/components/parameters/skip'
                - $ref: '#/components/parameters/limit'
                - $ref: '#/components/parameters/order_by'
                - $ref: '#/components/parameters/count'
            responses:
                "200":
                    content:
                        application/vnd.netapp.bxp.supportedModels+json:
                            schema:
                                $ref: '#/components/schemas/supportedModel_1.0_list_response_body'
                    description: Successfully retrieved the list of models.
                "400":
                    content:
                        application/vnd.netapp.bxp.problem+json:
                            schema:
                                $ref: '#/components/schemas/type_bxp_problem_detail'
                    description: Bad Request - Invalid query parameters.
                "401":
                    content:
                        application/vnd.netapp.bxp.problem+json:
                            schema:
                                $ref: '#/components/schemas/type_bxp_problem_detail'
                    description: Unauthorized - Authentication required.
                "403":
                    content:
                        application/vnd.netapp.bxp.problem+json:
                            schema:
                                $ref: '#/components/schemas/type_bxp_problem_detail'
                    description: Forbidden - Insufficient permissions.
                "500":
                    content:
                        application/vnd.netapp.bxp.problem+json:
                            schema:
                                $ref: '#/components/schemas/type_bxp_problem_detail'
                    description: Internal Server Error.
            summary: List all available LLM models supported by agentic platform
            tags:
                - Supported Models
            x-permission: model-read
            x-persistence: false
            x-scope: private,public,documentation,ncl
