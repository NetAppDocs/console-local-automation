security:
    - bxp_bearer_auth: []
servers:
    - url: '{{.Server}}'
tags:
    - description: |-
        The health endpoints enable you to monitor the health of the configuration manager service status.

        You can perform the following actions using the health endpoints:
        <ul>
        <li>Check service health</li>
        </ul>
      name: Health
    - description: |-
        The supported provider endpoints expose the catalog of Large Language Model (LLM) providers (OpenAI, Azure OpenAI, Anthropic, AWS Bedrock, Google Vertex AI, Google Gemini, and OpenAI-compatible providers) that the Agentic Platform can be configured to use.

        You can perform the following actions using the supported provider endpoints:
        <ul>
        <li>List supported providers</li>
        <li>Retrieve a supported provider</li>
        </ul>
      name: Supported Providers
    - description: |-
        The configuration endpoints enable you to manage the active Large Language Model (LLM) configuration consumed by the Agentic Platform, including provider credentials, base URL, rate limits, SSL verification settings, and the configuration state lifecycle (DRAFT, TESTING, SUCCESSFUL, UNSUCCESSFUL).

        You can perform the following actions using the configuration endpoints:
        <ul>
        <li>List configurations</li>
        <li>Create a configuration</li>
        <li>Retrieve a configuration</li>
        <li>Update a configuration</li>
        <li>Delete a configuration</li>
        </ul>
      name: Configuration
    - description: |-
        The supported model endpoints expose the curated allow-list of LLM models that the Agentic Platform has validated for the currently configured provider.

        You can perform the following actions using the supported model endpoints:
        <ul>
        <li>List supported models</li>
        <li>Retrieve a supported model</li>
        </ul>
      name: Supported Models
    - description: |-
        The provider model endpoints query an LLM provider's own API to discover the models it exposes. Credentials can be supplied directly in the request body (for testing) or resolved from a saved configuration by `config_id`.

        You can perform the following actions using the provider model endpoints:
        <ul>
        <li>List models for ad-hoc provider credentials</li>
        <li>List models for a saved configuration</li>
        </ul>
      name: Provider Models